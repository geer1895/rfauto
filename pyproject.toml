[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rfauto"
version = "0.10.0"
description = "Automated RF/microwave simulation and tuning across HFSS, ADS, openEMS and more"
readme = "README.md"
# PEP 639（0dd⑥）：license 用 SPDX 表达式 + license-files 列表；
# 废弃的 license classifier 已删（PEP 639 禁 classifier+SPDX 并存）。
# SPDX 值跟随 LICENSE 文件文本（本仓 LICENSE=GPL-3.0 文本，全仓声明
# GPL-3.0-only，与 README/CITATION.cff 同口径）。
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "rfauto developers" }]
keywords = [
    "RF", "microwave", "S-parameters", "HFSS", "ADS", "openEMS",
    "simulation", "optimization", "calibration", "MCP", "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10,<3.13"
dependencies = [
    # 核心框架依赖（P0 即需）
    "pydantic>=2.5.0",
    "omegaconf>=2.3.0",
    "loguru>=0.7.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    # <2.5 上界：与 uv.lock 基线（2.4.x）对齐——2.5 起数值路径变化会漂移
    # 少数优化器轨迹敏感测试（trust_region/topology 等），公开仓独立门实测
    "numpy>=1.24.0,<2.5",
    "scipy>=1.11.0",
    "scikit-rf>=2.0,<3",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "optuna>=5.0.0,<6.0",  # 5.0 升级实测无破坏面后抬底；锁 <6.0（set_constraint 新 API 为 5.0 引入面）
]

[project.optional-dependencies]
# EDA SDK —— P1/P3 起按需安装，仅在 adapters/ 内 import（军规 8）
hfss = ["pyaedt>=1.4.0,<2"]  # 开发基线 1.4.0：API 参数名与旧版差异大，禁止降级
# pymoo 多目标优化 —— P2 起按需；cmaes 为 optuna CmaEsSampler 的后端（缺口 5）
multiobj = ["pymoo>=0.6.0", "cmaes>=0.13.0"]
# MCP Server —— P4 起按需
mcp = ["fastmcp>=3.0,<4"]  # 4.x 严格 JSON 把 inf 序列化为 null（MCP 工具回执 NaN/Inf 面，实测 2026-10）
# UI（人工核验台 rfauto ui）—— starlette 路由 + uvicorn 服务
#（#178 教训：旧 venv 手动装过、声明缺失，换机即断——WP0.1 收编）
# sse-starlette = 战役进度 SSE 桥（ui/server.py 事件流端点；缺装时
# 端点 503 如实报缺，UI 其余面不受影响）
ui = ["starlette>=0.35", "uvicorn>=0.27", "sse-starlette>=3.0"]
# openEMS Python 绑定运行时依赖 —— 绑定本体（C 扩展）无 PyPI wheel，需从
# openEMS 源码自行编译进 venv（参考 scripts/build_python_bindings.cmd），
# 此处只声明绑定 import 时的依赖（numpy/matplotlib 已在核心依赖里）
openems = ["h5py>=3.0"]
# SMT 2.x（ONERA）—— smt_kriging 代理（阶段 1.2/6.2 co-kriging 基座）；
# 可选依赖：未安装时注册表可见但 fit/predict 显式报错
smt = ["smt>=2.9"]
# scikit-learn GBDT 代理（B3/#253③）—— sk_gbdt（GradientBoostingRegressor）；
# 同时收编 src 已在用但此前零声明的 sklearn import（surrogate_analysis 的
# GP 离线分析、prescreener 的 GP 预筛）。可选依赖：未安装时注册表可见
# 但 fit/predict 显式报错
gbdt = ["scikit-learn>=1.3,<3"]
# torch（CPU 版）—— fno_lite 曲线算子原型（阶段 6.3）；GPU 化待硬件
torch = ["torch>=2.0"]
# VNA 硬件通道（方向 3）—— pyvisa 底座；无硬件环境不需要安装
vna = ["pyvisa>=1.13"]
# VNA 离线 CI（DP-11 P1）—— pyvisa-sim YAML 声明仪器应答（#139 零网络零硬件）
# + pyvisa-py 后端（TCP socket/串口覆盖）；仅在 measurement/ 与
# adapters/vna_adapter.py 惰性 import。安装：pip install rfauto[vna-sim]
vna-sim = ["pyvisa>=1.13", "pyvisa-sim>=0.5", "pyvisa-py>=0.7"]
# PySR 符号回归（DP-14 M1 锚公式自动发现）—— Julia 组件由 pysr 首跑
# 自装；仅 scripts/pysr_anchor_fit.py 惰性 import，主链零依赖。
# 安装：pip install rfauto[pysr]
pysr = ["pysr==2.5.0"]
# 文献挖掘管线（DP-18 C9）—— PyMuPDF 文本层（降级路线=md 直读零依赖）
# + lark（sympy parse_latex 后端，避开 antlr4 与 omegaconf 的版本冲突）；
# 仅 scripts/lit_mine_pipeline.py 惰性 import。
lit-mining = ["PyMuPDF>=1.24", "lark>=1.1", "sympy>=1.12"]
# 数据集注册表 v2 —— Parquet 物化（pyarrow）+ DuckDB 直查；
# 可选依赖：未安装时 materialize/query 显式报错（dataset_service 同 smt 模式）
dataset = ["duckdb>=1.0", "pyarrow>=14.0"]
# COMSOL Multiphysics（RF Module）桥 —— MPh（JPype）连 comsolmphserver 6.3（WP4.4c）；
# 仅在 adapters/comsol_adapter.py 求解路径内惰性 import；无 COMSOL 环境不需要安装
comsol = ["MPh>=1.4"]
# NGSolve（开源 FEM）—— A9 零 license 频域通道（待确证项实测通过）：
# Windows cp312 wheel 直装；HCurl 时谐 Maxwell 已实测可建/可解
# （scripts/ngsolve_probe.py，PEC 单位立方腔基模 vs 闭式 pi*sqrt(2) rel_err 0.3%）；
# 端口激励/S 参数无现成 API，需手工 mode matching 后处理。
ngsolve = ["ngsolve>=6.2"]
# JAX 原生可微 FDTD（A7，FDTDX/rfx 路线）—— CPU wheel 直装（含 jaxlib ~68MB）；
# GPU 为用户侧跳过项，本项只确证 CPU 小规模可微性
# （scripts/jax_probe.py：1D Yee FDTD jax.grad vs 中心差分 rel_err 1.7e-8，jax/jaxlib 0.11.1）。
# python_version 标记：jax>=0.11.1 仅支持 py≥3.12（universal 锁在
# 3.10/3.11 分叉无解实证 2026-10-07）——3.10/3.11 用户装此 extra 为空集
# （要 jax 可微 FDTD 请用 3.12），requires-python 全域可解。
jax = ['jax>=0.11.1; python_version >= "3.12"']
# FDTDX 真引擎（§10.24 A7"真引擎/GPU 待续"的 CPU 接入，adapters/fdtd_diff.py）——
# 传递依赖 jax>=0.4.36；注意 tidy3d 间接钉 numpy<2.5、fastmcp<4（安装时会让
# venv 内 numpy/fastmcp 降级，pip check 无冲突即可用）
# python_version 标记：fdtdx 0.6.2 仅支持 py≥3.11（universal 锁分叉实证）。
diff-fdtd = ['fdtdx>=0.6.2; python_version >= "3.11"']
# pydantic-ai（slim+openai extra）—— WP3.1 runtime: pydantic_ai 可选依赖组：
# 未安装时 create("pydantic_ai") 照常注册（懒加载），submit 报 PydanticAINotInstalled；
# 安装：pip install rfauto[pai]。版本口径见 service/pydantic_ai_runtime.py 源码核对注记
pai = ["pydantic-ai-slim[openai]>=1.0,<3"]
# SI 通道报告（T2）—— COM（IEEE 802.3-22 Annex 93A/178A 冻结口径，
# PyChOpMarg 参考实现）；仅 service/si_channel_service.py 惰性 import，
# 未安装时 COM 段显式降级报缺、TDR/无源性/因果性段照常
si = ["pychopmarg>=3.1"]
# FDTD 后处理 run 间并行（F2）—— loky 可复用执行器（进程池复用+
# worker 内 BLAS 钉 1 #258）；仅 infra/par_exec.py 惰性 import，缺省串行
loky = ["loky>=3.4"]
# runs/ 湖冷层压缩（F3）—— lake_service pack_campaign tar.zst；
# 缺装时 pack/restore 显式报缺
zstandard = ["zstandard>=0.24"]
# G9 场可视化 3D（§10.7）—— PyVista（VTK）等值面/切片 web 化；仅在
# infra/visualization.py::field_isosurface 内惰性 import，未安装时 numpy/
# matplotlib 等值线降级（engine 标签如实回写，#105 best-effort 不阻塞主路径）。
# vtk wheel 约 100MB+，按需安装：pip install rfauto[viz3d]
viz3d = ["pyvista>=0.43", "vtk>=9.2", "meshio>=5.3"]
# 报告双输出链（DP-13 U1/DP-16 C5-L2）—— typst-py 出 PDF + plotly 自包含
# HTML 同源双出；SciencePlots 出版级静态图。matplotlib 已在核心依赖。
# 仅在 service/report_render.py 与 infra/visualization.py 惰性 import，
# 未安装时显式报错指明 pip install rfauto[report]（不静默降级）。
report = ["scienceplots>=2.1", "plotly>=5.20", "typst>=0.11"]
# 渲染前声明式几何约束（R4）—— z3-solver SMT 一次求解 +
# UNSAT core 全量冲突报告（#152 最小线距/#311 缝内线数/recipe bounds）；
# 仅 core/render_constraints.py 惰性 import（顶层零依赖），未安装时
# solve_rules 优雅降级 ok=False（不崩、不阻塞既有 if 链守卫主路径）
z3 = ["z3-solver>=4.13"]
# HFSS → 可机加交付包（T43）—— ezdxf DXF 出图/面轮廓 + PyYAML 规则库文件
#（PyYAML 随 omegaconf 传递可得，extras 显式声明不靠传递）；仅
# adapters/fab_export/* 惰性 import。安装：pip install rfauto[fab]
fab = ["ezdxf>=1.0", "PyYAML>=6.0"]
# pint 单位桥 —— core/quantity.py 的 to_pint/from_pint 互换面；quantity 内核
# 本身零 pint 自洽（确定性内置单位表维持），桥函数惰性 import，未安装时
# ImportError 诚实降级并指向本 extra。安装：pip install rfauto[units]
units = ["pint>=0.24"]
# 几何 GNN 代理 pyg 通道 —— torch-geometric（BSD）真训练通道位；缺省 numpy
# 消息传递内核（optimization/surrogate/gnn_geom.py）零依赖覆盖小图合成验证面，
# backend="pyg" 时惰性探测 import（缺席显式报错指路本 extra）。
gnn = ["torch-geometric>=2.3"]
# 版图互操作 —— gdstk GDSII 读写（layout_interchange 惰性 import）+
# shapely LVS 连通分量（layout_lvs_service 惰性 import，缺装=error 信封带
# 安装提示）。gdstk=Boost 许可、shapely=BSD-3。安装：pip install rfauto[layout]
layout = ["gdstk>=1.0", "shapely>=2.0"]
# PyPO 物理光学（GPL-3，大电尺寸反射面/准光 PO 预估）——**无 PyPI 发行版**
# （pypopy 404 实测 2026-10-07，uv lock 全 extras 解析被此不可解 extra 卡死
# 实证），故不入 extras 面；使用=从上游源码安装 pypopy 后适配器自检可用
# （GPL 许可边界=fail-closed opt-in 门 RFAUTO_ALLOW_PYPO /
# RFAUTO_ALLOW_GPL_TOOLS + adapters/gpl/license_gate；适配器缺席显式报缺）。
# 规格原文 pypopy>=0.1 系纸面登记，按发行现状勘误（PSSFSS 0.3→0.1.0 同款
# 先例：规格先于上游发行版时按实测约束登记）。
# PSSFSS 严格快通道 —— pypssfss（MIT，Julia PSSFSS.jl RWG MoM 桥）FSS/超表面
# 族单胞 Floquet 快档；仅 adapters/pssfss_adapter.py 惰性 import，缺装
# is_available()=False 显式报缺。规格原文 pypssfss>=0.3 在 PyPI 无此版本
# （实测只有 0.1.0），按实测约束登记。已知上游钉冲突：pypssfss 0.1.0 钉
# rich~=14.0.0，会把 venv 内 rich 15 降级——安装后按需回装 rich（pypssfss
# 实测 rich 15 下功能正常）。
pssfss = ["pypssfss>=0.1"]
# 多机协同远程求解（v0）—— paramiko SSH/SFTP 通道（infra/remote_machines
# 懒加载，未安装时注册表/探活面可用、SSH 传输显式报错指明本 extra）。
# 安装：pip install rfauto[remote]
remote = ["paramiko>=3.0"]
# 文档站（mkdocs-material 路线）：mkdocs build + GitHub Pages 部署；
# 生成器 scripts/build_docs_pages.py 只用核心依赖（机读 rfauto 代码面），
# mkdocs-material 仅站点构建期需要。安装：pip install rfauto[docs]
docs = ["mkdocs-material>=9.5,<10"]
# RAG 语义档真 embedding 换装 —— sentence-transformers 仅
# service/rag_service.resolve_embedder 惰性 import；缺省（含本 extra 未装）
# 走 core/rag_embedding 确定性 hashing/TF-IDF 降级路线（离线零网络零下载）。
# 安装：pip install rfauto[rag]；模型获取是调用方环境责任（本 extra 不含模型）
rag = ["sentence-transformers>=2.2"]
# 开发依赖
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist==3.8.0",  # 并行日常门（钉版；日常=并行、终门=串行双轨）
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "import-linter>=2.0.0",  # P2: 架构分层契约验证（.importlinter）
    "packaging>=23.0",  # scripts/check_env_deps.py 依赖体检用（WP0.1）
    "hypothesis>=6.0",  # G15 物理不变量属性/元变测试（§10.19 D15/G15）
    "scikit-learn>=1.3",  # tests：surrogate_analysis 离线分析 GP（src 侧惰性导入带降级，tests 直依赖）
    "pyyaml>=6.0",  # tests：任务集 gold yaml 读写
    # 离线单测套件消费的可选内核：缺位时相应测试组 fail 而非 skip（公开仓
    # 独立环境实测），dev 一并声明保证 `pip install -e ".[dev]"` 后全套可跑
    "smt>=2.9",  # surrogate kriging（surrogate 同名 extra 的内核）
    "duckdb>=1.0",  # 数据集注册表直查
    "pyarrow>=14.0",  # 数据集 Parquet 物化
    "gdstk>=1.0",  # GDSII 版图通道（layout_interchange 惰性导入）
    "pypdf>=4.0",  # PDF 报告导出测试读回校验（export_report_pdf）
    "z3-solver>=4.13",  # tests：render_constraints 声明式几何约束（z3 extra 同内核）
    "pyvisa-sim>=0.5",  # tests：LibreVNA SCPI 离线应答（vna-sim extra 同内核）
    "pyvisa-py>=0.7",  # tests：VNA 离线后端
    "loky>=3.4",  # tests：par_exec 复用池（loky extra 同内核）
    "zstandard>=0.24",  # tests：lake pack/verify（zstandard extra 同内核）
    "pytest-randomly==5.0.0",  # 顺序依赖持续审计，seed 每次随机打印可复现
    "pytest-benchmark==5.3.0",  # 三热点基准（tests/unit/test_qm5_benchmarks.py）
    "pip-licenses==5.5.5",  # 许可合规门（scripts/license_gate.py 消费）
    "pip-audit>=2.7",  # 依赖漏洞门（scripts/audit_deps.py 消费，OSV/PyPI）
    "mutmut==2.5.1",  # 突变测试试点（scripts/qm9_mutmut_run.py；3.x 无原生 Windows 支持，钉 2.5.1）
    "pytest-rerunfailures==16.7",  # known_flaky 用例重跑隔离（RFAUTO_FLAKY_RERUN=1 才启用，物理红永不隔离）
    # 离线单测套件消费的可选内核（续）：缺位时相应测试组 fail 而非 skip，
    # dev 一并声明保证 `pip install -e ".[dev]"` 后全套可跑（公开仓独立环境实测）
    "h5py>=3.0",  # openEMS 绑定运行时依赖（openems extra 同内核；fd_oe 战役测试消费）
    "ezdxf>=1.0",  # fab extra 同内核（fab_export 离线 DXF 面）
    "shapely>=2.0",  # layout extra 同内核（layout_lvs_service 离线面）
    "plotly>=5.20",  # report extra 同内核（report_render 离线面）
    "scienceplots>=2.1",  # report extra 同内核
    "typst>=0.11",  # report extra 同内核（render_typ jinja2/typst 链）
    "PyMuPDF>=1.24",  # lit-mining extra 同内核
    "lark>=1.1",  # lit-mining extra 同内核
    "sympy>=1.12",  # lit-mining extra 同内核
    "pint>=0.24",  # units extra 同内核
    "pychopmarg>=3.1",  # si extra 同内核（com_pam4 离线面）
    "pysr==2.5.0",  # pysr extra 同内核（锚 guesses 离线面；Julia 仅真拟合期首跑自装）
    "mkdocs-material>=9.5,<10",  # docs extra 同内核（docs_site 构建测试）
]

[project.scripts]
rfauto = "rfauto.cli.main:app"
rfauto-mcp = "rfauto.mcp_server:main"  # MCP 发布包 console script（stdio 传输）

# P2-D3：插件 entry-point 发现（registry._discover_entry_points 读取此组）
[project.entry-points."rfauto.models"]
wilkinson-power-divider = "rfauto.models.wilkinson_power_divider.plugin:WilkinsonPDPlugin"
branchline-coupler = "rfauto.models.branchline_coupler.plugin:BranchlineCouplerPlugin"
patch-antenna = "rfauto.models.patch_antenna.plugin:PatchAntennaPlugin"
mline = "rfauto.models.mline.plugin:MlinePlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/rfauto"]

# sdist 发布卫生：hatchling 默认打包全部非 gitignore 文件，会混入本地工作
# 产物（ads_reference/ 含 ADS 文档快照——README 承诺不分发 Keysight 受保护
# 内容、pyaedt_reference/、skills/、运行数据与内部工作文档）。
# 只排除、不白名单。
[tool.hatch.build.targets.sdist]
exclude = [
    "/.hypothesis",
    "/.zcode",
    "/ads_reference",
    "/pyaedt_reference",
    "/skills",
    "/runs",
    "/_*.py",
    "/uv.lock",
    "/.pre-commit-config.yaml",
]

[project.urls]
Homepage = "https://github.com/geer1895/rfauto"
Repository = "https://github.com/geer1895/rfauto"
Issues = "https://github.com/geer1895/rfauto/issues"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    # RUF001/002/003：中文注释/文档/字符串中的全角标点（，：；）是刻意排版，
    # 不是"ambiguous character"事故——中文代码库应整体豁免这三条
    "RUF001",
    "RUF002",
    "RUF003",
    # B027：SimulatorAdapter 可选方法层（capabilities 模式）故意提供
    # 非抽象的空默认实现，调用前查 capabilities() 是既定契约（ADR-0010）
    "B027",
]

[tool.ruff.lint.isort]
known-first-party = ["rfauto"]

[tool.ruff.lint.per-file-ignores]
# 测试文件先做 sys.path 注入再 import rfauto（无 editable 安装环境下兜底），
# E402 是该模式的固有形态
"tests/*" = ["E402"]
# 历史探索/spike 脚本（ADS 官方 API 探路、openEMS 冒烟）是当时的调查证据，
# 保持原样不作现代化整改——仅豁免风格类规则
"scripts/spike_b_ads/*" = ["E402", "SIM115", "E741", "UP031", "F401", "RUF015"]
"scripts/spike_a_microstrip.py" = ["E402"]
"scripts/smoke_openems_adapter.py" = ["E402"]
# run_wilkinson_openems.py 顶层持有的绑定会话文件对象是脚本生命周期设计
"scripts/run_wilkinson_openems.py" = ["SIM115"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_edt: 需要真实 AEDT/ADS 环境（deselect with -m not real_edt）",
    "solo: 计时敏感/资源敏感测试，仅串行全量门与 CI 执行（并行门与 xdist 对照臂 deselect）",
]