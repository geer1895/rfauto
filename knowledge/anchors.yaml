      replaces: "无（将 calculators CPS_H_EFF_GAMMA_C/P 现值收编为带 provenance 锚；值逐位同）"
    registered_at: "2026-09-24T12:00:00+08:00"
    last_verified: null
    fallback: closed_form
    status: active
    consumers:
      - src/rfauto/core/calculators.py

  # ── SIW 等效宽度（Cassivi 2002 文献双源闭式）────────────────────────────
  - anchor_id: siw.w_eff.lit-v1
