    uncertainty: {value: 0.02e-9, kind: arbitration_interval}
    domain: null
    provenance:
      arbitration_runs: [runs/df5_c3fix]
      commit: caa79b5
      devlog: "HFSS 反解 0.12-0.13nH 区间中点=对齐基准（对齐基准立规）；OE 反解 0.20nH 如实登记为跨引擎发现不作定值"
