    template_family: [msl_siw_taper]
    engine_pair: null
    quantity:
      name: siw_w_eff_mm
      unit: mm
      semantics: "SIW 等效宽度（同宽 w_eff 同填充介质矩形波导等效口径）；几何设计规则（s≤2d、d<λ_sub/5）由 siw_check_design_rules 守卫，不入参数盒"
    expr: "w_mm - d_mm**2/(0.95*s_mm)"
    variables: [w_mm, d_mm, s_mm]
    uncertainty: {value: 0.02, kind: relative, note: "文献闭式无仓内定量误差数据，保守包络 2% 如实登记，待 SIW 锚判读回填（不臆造测量精度）"}
