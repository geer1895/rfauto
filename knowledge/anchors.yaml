# 物理标定锚注册表（DP-3，规格深案 §DP-3）
# 锚 = (模板族 × 引擎对 × 域) → (常量 | 曲线 | 公式)，描述引擎对系统偏差。
# 运行时只读；写入只经人工 commit（Agent 写面隔离，仓内约定）。
# 版本演进：锚修订不改历史——新证据登记 -vN+1，旧版 status: retired +
# superseded_by 保留原文（golden 证据零改写，#325/#326）。
# 单源计数：EXPECTED_ANCHORS/EXPECTED_ANCHOR_COUNT @ src/rfauto/core/anchors.py，
# 本文件增删锚必须同步该单源（tests/unit/test_anchors_store_service.py 钉）。
# status 枚举：active | stale | experimental | retired | awaiting_data
# （awaiting_data 为 DP-3 P1 批预声明扩展：骨架锚如实登记，data 回填后翻 active，
# 见 runs/df6_dp3anchors/criteria.md 〇节口径决定）。
# kind 枚举：constant | curve | formula | pointer（pointer=双值指针锚，
# OE/HFSS 双值登记不产 constant 数字、不就地求值——HFSS 窗 B→A 批启用）。
schema: anchors/v1
