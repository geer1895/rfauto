  # ── CPS 有效厚度因子 γ(εr)（引擎无关闭式锚，FD 裁判定标）─────────────────
  - anchor_id: cps.gamma_er.fdref-v1
    kind: formula
    template_family: ["*"]
    engine_pair: null
    quantity:
      name: cps_gamma_er
      unit: dimensionless
      semantics: "CPS 无地薄基板 tanh 映射有效厚度因子 h_eff = γ(εr)·h；εr→∞ γ→1、εr=1 超额项为零"
    expr: "1 + 0.9014*er**-0.6361"
    variables: [er]
    uncertainty: {value: 0.006, kind: relative, note: "8 档定标表最大相对偏差 0.56%（runs/df6_dp18c9 gate_b_numeric）之上留一档余量"}
    domain:
      er: [1.5, 12.9]
    provenance:
      arbitration_runs: [runs/df6_dp14m1, runs/df6_dp18c9]
      commit: cb7e900
      devlog: "C9 FD Laplace 定标落库；M1 PySR 重发现（max rel 3.4e-4）与 C9 文献挖掘双通道复核，候选 JSON 随本批登记（runs/df6_dp3anchors）"
      referee_script: scripts/fd_laplace_tline_referee.py
      data_source: docs/rf_template_references.md
      data_source_note: "§11.1 8 档定标值（--refit-cps-gamma 复现源）"
      candidates:
