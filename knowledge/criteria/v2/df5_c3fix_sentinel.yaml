schema: criteria/v2
criteria_id: df5_c3fix_sentinel_four_gates
title: df5-c3fix OE 哨（interdigital stage1 12ks 帽）四门——V&V v2 机器判据源
status: active_v2
runner_binding: followUp   # 本批只建库；runner 常量切换改从 v2 机器读=后续批（DP-12 §3 双落盘）

# 双落盘语义：md=渲染产物（runs/df5_c3fix/criteria.md §五，人读），本文件=机器
# 判据源。历史档零改写：本文件只消费 runs/df5_c3fix/sentinel_verdict.json 的
# 证据字段，不改写任何已归档判读（#325/#326）。
claim:
  quantity: s21_inf_extrapolation_db   # 外推键 s21_peak/s21_f0/s11_f0 的置信门族（哨验收量）
  template: interdigital
  f_ghz: 2.5
evidence_fields:
  - four_gates.dev_db.obs            # 0.406（dev ≤0.5 ok）
  - four_gates.dev_db.max            # 0.5
  - four_gates.holdout_rel.obs       # 0.00502（≤0.05 ok）
  - four_gates.holdout_rel.max       # 0.05
  - four_gates.span_db.obs           # 12.443（≥20 不过）
  - four_gates.span_db.min           # 20.0
  - four_gates.s21_inf_f0_db.obs     # -10.34（≥-3.0 不过）
  - four_gates.s21_inf_f0_db.min     # -3.0
  - budget.declared                  # 超 1.5×=PARTIAL
  - budget.actual                    # 15600s ≈ 1.3×（不判超预算）
  - mode_pair_verdict.verdict        # PASS（模对窗 [2.44,2.52]）
u_val:
  u_num:
    source: ladder
    rule: "u_num = Fs·max|Δφ_ladder|（Fs=1.25，core/vv_mapping.u_num_from_ladder）；饱和合格级=相邻级差≤0.2dB 且末两级≤0.1dB 且级数≥2（#335① 勘误节，_ladder_saturated 同口径）；不饱和/级数不足→None（validation_not_attempted，不虚构）。本哨面（OE 帽停）无 ΔS 阶梯：span 门本身即 α（u_num）可辨性账——12.44dB<20dB ⇒ u_num 不可估，只作注记不翻案四门 FAIL 的 not_validated。"
  u_input:
    source: holdout_rel
    rule: "外推拟合 holdout 相对误差（样本代表性分量）；门 ≤0.05（criteria_a 沿用常量）"
  u_D:
    source: none_declared
    rule: "设计面 D 分量本哨未单列——unknown 不虚构（预声明）；降级消费须显式提供已声明 fallback（保守 k=3）"
decision_rule:
  form: multi_gate_all_pass
  gates:
    dev_db:        {op: "<=", threshold: 0.5,  evidence: four_gates.dev_db.obs}
    holdout_rel:   {op: "<=", threshold: 0.05, evidence: four_gates.holdout_rel.obs}
    span_db:       {op: ">=", threshold: 20.0, evidence: four_gates.span_db.obs}
    s21_inf_f0_db: {op: ">=", threshold: -3.0, evidence: four_gates.s21_inf_f0_db.obs}
  budget_conditional:
    op: "<="
    ratio_limit: 1.5
    on_exceed: conditionally_validated   # PARTIAL 超预算注记（哨 1.3× 实例=不触发）
  overall: 四门全过→PASS；任一不过→FAIL（fail_kind=gates）→ v2 not_validated
verdict_map:
  PASS: validated
  FAIL: not_validated
  PARTIAL: conditionally_validated
  UNKNOWN: not_judged
provenance:
  commit: 9ed833b
  devlog: "df5 批语境（#335① 勘误、#195 s11_db_min 收口）；DP-12 批条目随批留档"
  referee_run: runs/df5_c3fix/sentinel_verdict.json
  gate_db_legacy: "runs/df5_c3fix/criteria.md §五（2026-09-22 预声明，门值沿用 criteria_a 既有常量）；现行四门阈值即历史 U_val 近似"
