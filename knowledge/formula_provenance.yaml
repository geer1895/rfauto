    \ §10.3.1 口径）：0.75 < C_λ < 4/3\n  （本模块以 C_LAMBDA_HIGH = 4/3 入码，对外可读 1.333…）、\n  12° < α < 14°、N >\
    \ 3（严格）；α 为螺距角，几何定义\n  tan α = S/(πD) ⇒ S = πD·tanα = C·tanα。\n- **轴上轴比** AR = 1 + 1/(2N)（= (2N+1)/(2N)，Kraus；二手可达来源\n\
