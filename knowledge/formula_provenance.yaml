    \ 与 S(z̄) 逐位相同、梯度恰为 0）。复步长的适用前提是\n  \"实点处中间值全实\"，不是\"复数算术即可\"。\n- **响应目标的实块载体（本仓推导）**：Y=Yr+i·Yi、v=vr+i·vi\
    \ 代入\n  Yv=e0 展开为 2n×2n **实**线性系统 [[Yr,−Yi],[Yi,Yr]]·[vr;vi]=[e0;0]，\n  其中 Yr（端口对角=qe，其余 0）与 Yi（内节点对角=Ω−m_ii、非对角=−m_ij）\n\
    \  都是参数的实代数式——实点处 vr/vi 全实，复步长经此载体机器精度。"
