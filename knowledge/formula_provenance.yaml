    \ · exp(k·x)，  k = ln(w_mouth / w_throat) / L\n\n  指数律的判读性质（对数螺旋/tapered slot 文献通称）：工作波长 λ 与\n  局部槽宽\
    \ w 同量级处能量辐射出去 → 对数周期性宽带行为，k 越小\n  （张口越缓）方向图越窄、低频越向口面外推。\n- **低截止工程准则**：口面宽度 w_mouth ≈ λ0/2 时开始有效端射辐射\
    \ →\n\n      f_low = c / (2 · w_mouth)          （自由空间半波口径）\n\n  **二手工程口径如实登记**：文献通称准则（Vivaldi 类端射槽线天线\n\
