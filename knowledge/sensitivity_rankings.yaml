  留缺判定 #222 复核勘误）；列表参数管线扩展+零值名义参数 NON_PERTURBABLE 0 分声明。aurora_g W6-S4 解锁批（2026-10-19）+1=71/72：sir_bpf
  名义重注册（l_high 6.7818 旧档含 R1 校准过孔缩短致恒等式名义回代 2.5586GHz 失自洽，重注册为 理想短路缺省链输出 7.1055 后名义回代 2.5000 带内——R3 审计处方；过孔补偿留
