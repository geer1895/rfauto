# RFAuto 全局配置（§6 / §1.3）
# 
# 加载优先级：环境变量(RFAUTO_*) > 本文件 > 代码默认值
# 本文件提交到 git，不含机器绝对路径（用环境变量覆盖）
# 本机路径写入 settings.local.yaml（gitignore）

# ── Ansys AEDT ──
aedt:
  # 路径：优先用环境变量 RFAUTO_AEDT_PATH
  path: ""
  # gRPC 端口
  grpc_port: 50051
  # 已测试版本组合（doctor 会核对；实测 2023R1 + 2025R1）
  tested_versions:
    - "2023R1"
    - "2025R1"

# ── Keysight ADS ──
ads:
  # 路径：优先用环境变量 RFAUTO_HPEESOF_DIR
  hpeesof_dir: ""
  tested_versions:
    - "2024"

# ── 通用 ──
defaults:
  unit: mm
  timeout_solve_s: 3600
  max_concurrent_solves: 1

# ── 缓存 ──
cache:
  # off | on（环境变量 RFAUTO_CACHE 可覆盖）
  mode: on

# ── 计算器 ──
calculators:
  # 实验态计算器开关：符号回归归纳公式等
  # experimental=True 的键默认拒绝运行；true 放行（也可逐次调用显式
  # allow_experimental=true）。环境变量 RFAUTO_CALCULATORS_ALLOW_EXPERIMENTAL
  # 可覆盖（1/true/yes/on）。清单（list_calculators）始终列出并打 experimental 标签。
  allow_experimental: false

# ── 工作区 ──
workspace:
  # 优先用环境变量 RFAUTO_WORKSPACE
  dir: ""
  runs_dir: runs
# ── 注册表数据库 ──
db:
  # 注册表 SQLite 路径：空 = runs/registry.sqlite（缺省，行为不变）。
  # 环境变量 RFAUTO_REGISTRY_DB 优先级高于本键（env > YAML > 默认，同全局三层口径）。
  path: ""
  # job 注册表持久化（R2-D03 ③半）：true 时 JobRegistry 的 create/finish/fail/
  # cancel 同步写 jobs 表（跨进程重启后 poll 仍可查）；false 维持纯内存 +
  # meta.json（缺省，行为不变）。环境变量 RFAUTO_JOB_REGISTRY_DB 优先级更高
  # （可给 1/true/on，或直接给库文件路径；坏布尔安全侧按关处理）。
  job_registry_persist: false
  # 数据集物化回写注册表（R2-D03 ⑤）：true 时 materialize/import-workdir 与
  # visibility 切换把数据集行同步写进 datasets 表；false 不写库（缺省，零
  # 行为变化）。CLI --registry-sync/--no-registry-sync 显式实参优先于本键。
  dataset_registry_sync: false
