# wilkinson 位置锚（eps_eff_scale，乘法缩放语义）决策史：
#   - p0 A/B 实验后曾定"不启用"（绝对 eps_eff=1.4 试验：无锚
#     ρ=-0.164 / 锚 1.4 ρ=-0.200，锚不改善跨保真排序；同日 v1 调查
#     四级实验位置锚 3.54 也只到 0.608——证据链固化 knowledge/rules.yaml
#     R008。根因=openEMS 对该几何族的 λ/4 点系统性低于闭式解，跨保真
#     桥接交校准层 surrogate）。
#   - 后判定：3.54 系实验推导值，实验口径（乘法缩放）与配置面（绝对覆盖）
#     语义不兼容；最终裁定**乘法缩放语义**落配置：eps_eff_scale = K =
#     3.54/2.725。3.54=openEMS 名义谷位 2.2GHz 的 λ/4 反推；2.725=HJ
#     物理参考点（forward_z0 series 臂 @2.4GHz 实测 2.724642，缩放后
#     3.5395≈3.54 自洽）。锚=对 HJ 推导 εeff 乘恒定频率尺度修正
#     （谷位 ×√(2.725/3.54)=0.8774，下移 ~12%），设计点移动时修正因子
#     恒定、εr 物理含义不漂移；拒绝绝对覆盖（会把尺度修正换成硬编码绝对值）。
#   - **R008 结论不变**：本锚动机=fake 通道谷位保真（UI/冒烟/演示口径对齐
#     openEMS 名义），不承诺预筛排序改善；预筛通道仍是校准代理（NN），
#     fake/公式通道不承担预筛（rules.yaml R008，动 fake/预筛前必读）。
#   - golden 同步：wilkinson_fake_baseline 4 指标已同批重钉。
models:
  branchline:
    eps_eff: 3.28           # branchline 真机 HFSS 校准值（2026-08-31）
  patch:
    eps_eff: 3.27           # 由 f_res=2.375GHz 反演
  wilkinson:
    eps_eff_scale: 1.2990825688073395   # =3.54/2.725（乘法缩放位置锚，2026-09-23）
