# 材料库映射 —— 逻辑材料名 → HFSS 材料名
# AEDT 版本不同材料库命名可能微差，doctor 会按已测试版本组合表提示核对

materials:
  rogers4350b_h0.508:
    hfss_name: "Rogers RO4350 (tm)"
    epsilon_r: 3.66
    loss_tangent: 0.0037
    thickness_mm: 0.508
    description: "Rogers 4350B, 0.508mm, 2.4GHz 典型"
    # G0 gate verified linewidths (2026-09, three-source cross-check)
    linewidth:
      z0_50ohm_mm: 1.11
      z0_35ohm_mm: 1.87
      source: "G0 gate: skrf MLine (HJ) + Pozar + Schneider, max dev 0.45%"
      verified_by: "scripts/g0_linewidth_verification.py"
      verified_date: "2026-09"
      note: "旧值 2.20mm 实测 ~31ohm (非标称35.35ohm), -6dB plateau 部分根因"

  # D1 色散变体：厂商 datasheet 单点 (Dk/Df) + Djordjevic-Sarkar 因果宽带拟合。
  # 只读消费者：core/dispersion.py::load_dispersion_material（加性条目，不影响
  # 既有常数材料的 Stackup 加载）。
  rogers4350b_h0.508_dispersion:
    hfss_name: "Rogers RO4350 (tm)"
    epsilon_r: 3.66
    loss_tangent: 0.0037
    thickness_mm: 0.508
    description: "Rogers RO4350B, 0.508mm — Djordjevic-Sarkar 因果宽带色散模型"
    dispersion:
      model: "djordjevic_sarkar"
      # 数据源：Rogers RO4350B datasheet，Dk=3.66 / Df=0.0037 @ 10 GHz
      f_meas_hz: 10000000000.0
      eps_r_meas: 3.66
      tan_delta_meas: 0.0037
      # 频带端点：openEMS 官方例默认口径 (f1=1 MHz, f2=200 GHz)
      f1_hz: 1000000.0
      f2_hz: 200000000000.0
      sigma_dc: 0.0
      source: "Rogers RO4350B datasheet (Dk=3.66, Df=0.0037 @ 10GHz); fit per openEMS AddDjordjevicSarkarMaterial / CalcDjordjevicSarkarApprox"
      source_url: "https://openems.readthedocs.io/en/latest/octave/autogenerated/CSXCAD/AddDjordjevicSarkarMaterial.html"
      verified_by: "tests/unit/test_dispersion.py (K-K residual < 1e-9; single-point round-trip exact)"
      verified_date: "2026-09-12"

  rogers4003c_h0.508:
    hfss_name: "Rogers RO4003C (tm)"
    epsilon_r: 3.38
    loss_tangent: 0.0027
    thickness_mm: 0.508

  fr4_h1.6:
    hfss_name: "FR4_epoxy"
    epsilon_r: 4.4
    loss_tangent: 0.02
    thickness_mm: 1.6

  copper:
    hfss_name: "copper"
    conductivity: 5.8e7

  air:
    hfss_name: "vacuum"
    epsilon_r: 1.0