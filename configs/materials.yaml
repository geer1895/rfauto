# 材料库映射 —— 逻辑材料名 → HFSS 材料名
# AEDT 版本不同材料库命名可能微差，doctor 会按已测试版本组合表提示核对

materials:
  rogers4350b_h0.508:
    hfss_name: "Rogers RO4350 (tm)"
    epsilon_r: 3.66
    loss_tangent: 0.0037
    thickness_mm: 0.508
    description: "Rogers 4350B, 0.508mm, 2.4GHz 典型"
    # DP-7 P2 公差单源：εr 制造容差（半宽，εr 同单位）。消费方：
    #   service/fab_service.py::load_material_epsilon_r_tolerance
    #   （σ = tol/k_sigma，3σ 口径）。核对状态=verified-web（Rogers 官方
    #   RO4000 系列页属性表逐字核对，沿用 knowledge/fab_profiles 约定，#122）。
    epsilon_r_tol_abs: 0.05
    epsilon_r_tol_source: "Rogers 官方 RO4000 系列 datasheet 属性表（rogerscorp.com/advanced-electronics-solutions/ro4000-series-laminates/ro4350b-laminates，verified-web）：process Dk 3.48±0.05 @10GHz/23°C（clamped stripline process specification）；Design Dk 3.66（Rogers 推荐阻抗设计名义，本条目 epsilon_r 取此值）无官方容差发布 → 制造容差半宽取 process spec ±0.05。原登记 process Dk 3.66±0.08 与官方不符且无出处，复核修正"
    # G0 gate verified linewidths (2026-09, three-source cross-check)
    linewidth:
      z0_50ohm_mm: 1.11
      z0_35ohm_mm: 1.87
      source: "G0 gate: skrf MLine (HJ) + Pozar + Schneider, max dev 0.45%"
      verified_by: "scripts/g0_linewidth_verification.py"
      verified_date: "2026-09"
      note: "旧值 2.20mm 实测 ~31ohm (非标称35.35ohm), -6dB plateau 部分根因"

  # D1 色散变体：厂商 datasheet 单点 (Dk/Df) + Djordjevic-Sarkar 因果宽带拟合。
  # 只读消费者：core/dispersion.py::load_dispersion_material（加性条目，不影响
  # 既有常数材料的 Stackup 加载）。
  rogers4350b_h0.508_dispersion:
    hfss_name: "Rogers RO4350 (tm)"
    epsilon_r: 3.66
    loss_tangent: 0.0037
    thickness_mm: 0.508
    description: "Rogers RO4350B, 0.508mm — Djordjevic-Sarkar 因果宽带色散模型"
    dispersion:
      model: "djordjevic_sarkar"
      # 数据源：Rogers RO4350B datasheet，Dk=3.66 / Df=0.0037 @ 10 GHz
      f_meas_hz: 10000000000.0
      eps_r_meas: 3.66
      tan_delta_meas: 0.0037
      # 频带端点：openEMS 官方例默认口径 (f1=1 MHz, f2=200 GHz)
      f1_hz: 1000000.0
      f2_hz: 200000000000.0
      sigma_dc: 0.0
      source: "Rogers RO4350B datasheet (Dk=3.66, Df=0.0037 @ 10GHz); fit per openEMS AddDjordjevicSarkarMaterial / CalcDjordjevicSarkarApprox"
      source_url: "https://openems.readthedocs.io/en/latest/octave/autogenerated/CSXCAD/AddDjordjevicSarkarMaterial.html"
      verified_by: "tests/unit/test_dispersion.py (K-K residual < 1e-9; single-point round-trip exact)"
      verified_date: "2026-09-12"

  rogers4003c_h0.508:
    hfss_name: "Rogers RO4003C (tm)"
    epsilon_r: 3.38
    loss_tangent: 0.0027
    thickness_mm: 0.508
    # DP-7 P2 公差单源：εr 制造容差（半宽，εr 同单位）。核对状态=verified-web
    # （Rogers 官方 RO4000 系列页属性表逐字核对，值与登记一致）。
    epsilon_r_tol_abs: 0.05
    epsilon_r_tol_source: "Rogers 官方 RO4000 系列 datasheet 属性表（rogerscorp.com/advanced-electronics-solutions/ro4000-series-laminates/ro4003c-laminates，verified-web）：process Dk 3.38±0.05 @10GHz/23°C（clamped stripline process specification），与登记一致；Design Dk 3.55（本条目 epsilon_r 取 process Dk 口径）"

  fr4_h1.6:
    hfss_name: "FR4_epoxy"
    epsilon_r: 4.4
    loss_tangent: 0.02
    thickness_mm: 1.6

  copper:
    hfss_name: "copper"
    conductivity: 5.8e7

  air:
    hfss_name: "vacuum"
    epsilon_r: 1.0