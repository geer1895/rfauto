# DP-11 P1：pyvisa-sim 仪器定义（零硬件 CI，#139 钉）
#
# 消费面对齐纪律（criteria.md G1）：本文件的对话（dialogues）与
# measurement/librevna.py 的命令常量**逐字对齐**——命令串大小写/空格/逗号
# 逐字节核对（tests/unit/test_vna_adapter.py::TestPyvisaSimChain 钉）。
#
# 应答数据：确定性解析值（5 点扫频 1.0–3.0 GHz，S11=0.2·e^{+j2πf/4GHz}、
# S21=S12=0.9·e^{−jπf/2GHz}（互易无源 DUT）、S22=0.1·e^{+j2πf/5GHz}），
# 与 tests 断言逐位一致。TRACe:DATA? 应答形态 = 官方 ProgrammingGuide
# §VNA:TRACe:DATA 示例（[x,re,im] 元组逗号分隔、末尾带逗号）。
#
# 两个设备：calibrated（ACTIVE? → SOLT）/ uncalibrated（ACTIVE? → 空串
# =无激活校准，官方语义）。open_resource 必须显式 read/write_termination="\n"
# （与 eom 的 q/r 一致；默认 \r\n 会让对话匹配错位——tests 已钉）。
spec: "1.1"
devices:
  librevna_vna:
    eom:
      TCPIP INSTR:
        q: "\n"
        r: "\n"
    dialogues:
      - q: "*IDN?"
        r: "LibreVNA,LibreVNA-GUI,SN00042,1.0.4"
      - q: "VNA:FREQuency:START 1000000000.000000"
      - q: "VNA:FREQuency:STOP 3000000000.000000"
      - q: "VNA:ACQuisition:POINTS 5"
      - q: "VNA:ACQuisition:IFBW 1000.000000"
      - q: "VNA:ACQuisition:SINGLE TRUE"
      - q: "VNA:ACQuisition:RUN"
      - q: "VNA:ACQuisition:FINished?"
        r: "TRUE"
      - q: "VNA:CALibration:ACTIVE?"
        r: "SOLT"
      - q: "VNA:TRACe:LIST?"
        r: "S11,S12,S21,S22"
      - q: "VNA:TRACe:DATA? S11"
        r: "[1000000000.0,-3.2162452993532734e-17,0.2],[1500000000.0,-0.1414213562373095,0.14142135623730953],[2000000000.0,-0.2,-6.432490598706547e-17],[2500000000.0,-0.14142135623730953,-0.1414213562373095],[3000000000.0,-3.6739403974420595e-17,-0.2],"
      - q: "VNA:TRACe:DATA? S12"
        r: "[1000000000.0,-1.4473103847089729e-16,-0.9],[1500000000.0,-0.6363961030678927,-0.6363961030678928],[2000000000.0,-0.9,2.8946207694179457e-16],[2500000000.0,-0.636396103067893,0.6363961030678927],[3000000000.0,-1.6532731788489269e-16,0.9],"
      - q: "VNA:TRACe:DATA? S21"
        r: "[1000000000.0,-1.4473103847089729e-16,-0.9],[1500000000.0,-0.6363961030678927,-0.6363961030678928],[2000000000.0,-0.9,2.8946207694179457e-16],[2500000000.0,-0.636396103067893,0.6363961030678927],[3000000000.0,-1.6532731788489269e-16,0.9],"
      - q: "VNA:TRACe:DATA? S22"
        r: "[1000000000.0,0.030901699437494767,0.09510565162951536],[1500000000.0,-0.030901699437494698,0.09510565162951538],[2000000000.0,-0.08090169943749471,0.05877852522924736],[2500000000.0,-0.1,5.665538897647979e-17],[3000000000.0,-0.08090169943749481,-0.05877852522924723],"
