# rfauto CI
#
# 三级测试标签语义：
#   unit             —— tests/unit，无 EDA 依赖即可跑（fake 通道覆盖全部核心逻辑）
#   integration-fake —— fake 档集成（本仓当前归并在 tests/unit 内，同 job 覆盖）
#   real_edt         —— 真机 AEDT/ADS 路径，pytest marker `real_edt` 标记；
#                       CI 上永远以 `-m "not real_edt"` 排除，只验证可收集不执行
#
# Linux runner 是唯一允许的非 Windows 环境（用户环境约束：本机不做 Linux 适配）。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 活规则周期重跑（K1）：每周一 03:00 UTC 复跑 rules.yaml verify
    # 验证测试，防综合引擎（skrf/scipy）或依赖版本漂移使定案值失真。
    - cron: "0 3 * * 1"

jobs:
  quality:
    name: lint + contracts + numbers + encoding + sensitive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # pip 依赖缓存：key 按依赖声明文件哈希（pyproject.toml 是 pip
          # install -e . 的实际解析来源；uv.lock 有代际滞后不作 key）。
          # 缓存只加速下载，wheel 内容寻址，陈旧无害（缺的 pip 会现下）。
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          # 质量门工具钉版=本地门实测（2026-09-22 立规：浮动 latest 版本漂移
          # 如 ruff 新增 I001 检查会 CI 红/本地绿；ruff 0.16.6 /
          # import-linter 2.15 为本地 venv 实测版本）。
          pip install "ruff==0.16.6" "import-linter==2.15" pyyaml
          # check_numbers 会 import rfauto.cli 实测命令数——src 布局需要可安装态，
          # 且必须带核心依赖（typer 等被 import，--no-deps 会 ModuleNotFoundError）
          pip install -e .
      - name: ruff (src/ tests/ scripts/)
        run: ruff check src/ tests/ scripts/
      - name: import-linter contracts
        run: lint-imports --config .importlinter
      - name: number self-check (README vs code)
        run: python scripts/check_numbers.py
      - name: UTF-8 no-BOM encoding check
        run: python scripts/check_encoding.py
      - name: palace wrapper pinned-content check (graceful skip when assets absent)
        run: |
          if [ -f tools/palace-install/bin/palace.cmd ]; then
            python scripts/palace_wsl_wrapper.py --check
          else
            echo "palace wrapper assets not installed (tools/ is not in git); skipping check"
          fi
      - name: sensitive content scan
        run: python scripts/scan_sensitive.py

  test:
    name: pytest (unit + integration-fake, no EDA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 同 quality：pyproject.toml 哈希作缓存 key
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install package with test-relevant extras
        run: |
          python -m pip install --upgrade pip
          # dev 组含离线套件全部可选内核（smt/pyarrow/duckdb/gdstk/scikit-learn…），
          # 缺位时相应测试组 fail 而非 skip
          pip install -e ".[hfss,mcp,multiobj,dev]"
          # CJK 字体：report_render PDF 测试（typst 嵌字+pypdf 抽取 CJK 段
          # 标题）。runner 缺省无 Noto CJK → typst 无 CJK 字形可嵌，抽取
          # 全为 \x00（2026-10-07 CI 首跑实证）——装系统字体供
          # report_render._font_paths 的 /usr/share/fonts 扫描面拾取
          # （模板字体表第三顺位 "Noto Sans CJK SC"）。
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - name: Run unit + integration-fake tests (real_edt deselected)
        run: |
          # xdist loadfile 并行：内部仓 gate_parallel.py 先例直接搬
          # （8.55× 实测，2026-09-25 df6 批）；loadfile 按测试文件分组
          # 分发，不破坏文件内顺序依赖。真跑/重型 job 本 CI 不存在
          # （real_edt 恒被 deselect），故只有本纯单测 job 并行；
          # rules-verify 单文件 cron job 保持串行。
          # OPENBLAS_NUM_THREADS=1：xdist worker×BLAS 线程超订实测慢
          # 85×（内部 #258），必须在 pytest/numpy import 前生效。
          python -m pytest tests/unit -q -m "not real_edt" -n auto --dist=loadfile
        env:
          OPENBLAS_NUM_THREADS: "1"
      - name: Verify real_edt tests are collectable and always deselected in CI
        run: |
          python -m pytest tests/unit -m "real_edt" --co -q | tail -1
          echo "real_edt tests collected above; they are skipped by marker on CI (need real AEDT/ADS)."

  licenses:
    name: license compliance gate (P-3 pip-licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with test-relevant extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[hfss,mcp,multiobj]" pytest pip-licenses
      - name: Run license compliance gate (scripts/license_gate.py, ALLOWED+EXEMPT 表)
        run: python scripts/license_gate.py

  rules-verify:
    name: live rules periodic re-verify (K1, cron only)
    runs-on: ubuntu-latest
    # 只在 cron 触发时跑（push/PR 由 test job 覆盖同一批测试）
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 同 quality：pyproject.toml 哈希作缓存 key
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install package with test-relevant extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[hfss,mcp,multiobj,dev]"
      - name: Re-run live rules verify tests (rules.yaml verify subset)
        run: |
          # 单测试文件串行：xdist 分发无收益（loadfile 下单文件=单 worker），
          # 定案值复验保持确定性顺序。
          python -m pytest tests/unit/test_rules_verify.py -q -m "not real_edt"

  docker-build:
    name: Dockerfile build smoke (C14b)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        run: docker build -t rfauto:ci .
      - name: Container import smoke
        run: docker run --rm rfauto:ci python -c "import rfauto; print('ok')"

  # ---------------------------------------------------------------------
  # supply-chain（X5 供应链卫生门，2026-09-24）
  #
  # 三件套：pip-audit 漏洞审计 + CycloneDX SBOM + uv.lock 带哈希 requirements
  # 对外导出。工具一律钉版（浮动 latest=CI 红前科，2026-09-22 立规）：
  #   pip-audit    2.10.1   requires-python >=3.10（兼容 3.12，PyPI 实测）
  #   cyclonedx-bom 7.4.0   requires-python >=3.9,<4.0（兼容 3.12，PyPI 实测）
  #   uv           0.12.17  与 uv.lock（format v1 revision 3）同管理版本
  #
  # 审计形态=发现已知漏洞即 job 红（exit 非零）。2026-09-24 本地 dry-run：
  # base 锁集（50 pin）+ 工具集 0 已知漏洞（pip 升级到 26.x 后）；extras 面
  # （pyaedt/fastmcp/pymoo/dev 链）以 CI 首跑为准——若误伤，处置=依赖升级
  # 修复或显式 pip-audit --ignore-vuln 豁免清单（豁免须在 PR 描述与本注释
  # 同步留痕），不降级为 continue-on-error。
  #
  # 锁面现状（2026-10-07 刷新）：uv.lock 已按当前 pyproject 全图重解
  # （纸面 extra pypopy PyPI 404 移出 + jax/fdtdx 加 python_version 标记
  # 解 3.10/3.11 分叉）——uv lock --check 幂等通过，--frozen 导出 688 哈希。
  # 后续依赖变更后仓主重跑 uv lock 并同笔提交即可。
  # ---------------------------------------------------------------------
  supply-chain:
    name: supply chain (pip-audit + CycloneDX SBOM + hashed requirements)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 同 quality：缓存只加速依赖下载，不改变审计面（pip-audit 审的
          # 是安装后环境，与 wheel 来自缓存还是现下无关）
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install pinned supply-chain tools
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.10.1" "cyclonedx-bom==7.4.0" "uv==0.12.17"
      - name: Install package with test-relevant extras
        run: |
          # 与 test job 同依赖面——审计与 SBOM 覆盖 CI 真实安装集
          pip install -e ".[hfss,mcp,multiobj,dev]"
      - name: Export hash-pinned requirements from uv.lock
        run: |
          # 只读导出已提交的 uv.lock（--frozen 禁止改写锁文件）。
          # uv 0.12 导出默认带 --hash（去掉才用 --no-hashes），逐 pin 带
          # sha256，可配合 pip install --require-hashes 消费。
          # 行尾 grep 是守卫：导出零哈希（计数 0，grep 退出码 1）即本步红。
          uv export --frozen --no-dev --no-emit-project --format requirements.txt -o requirements-lock.txt
          grep -c -- "--hash=" requirements-lock.txt
      - name: Generate CycloneDX SBOM (JSON)
        run: |
          # 对安装后真实环境出 SBOM（含传递依赖）；CycloneDX spec 1.6 默认；
          # --output-reproducible 稳定 artifact（按规范省略随机 serialNumber）
          cyclonedx-py environment --of json -o sbom.json --pyproject pyproject.toml --output-reproducible
      - name: pip-audit fail on known vulnerabilities
        run: |
          # 环境模式审计（安装集即审计面，含供应链工具自身）；发现已知漏洞
          # 即非零退出；机器可读报告落 pip-audit-report.json 供 artifact 留档。
          # 审计面=上一步 uv export 的带哈希锁集（--no-emit-project 已排除
          # 本项目自体）：requirements 文件模式无 editable 分发解析问题
          # （venv 模式 --skip-editable 仍报 "distribution marked as
          # editable" rc=1，2026-10-07 二跑实证）——锁集即供应链审计对象。
          #
          # pillow 11.3.0 豁免清单（2026-10-07，18×PYSEC-2026，本注释即
          # 留痕处）：diff-fdtd extra 的 fdtdx→moviepy>=2.1.1 钉
          # pillow>=9.2.0,<12.0（冲突链 uv lock 亲证），pillow 12.3.0 虽
          # 已修复全部 35 项但被该上限排除；漏洞面=PSD/PDF/FITS 等**图像
          # 文件解析器**，本仓 pillow 仅作 matplotlib 栅格后端，不解析
          # 不可信图像文件。解锁条件=fdtdx/moviepy 放开 pillow<12 上游
          # 升级后删除全部 --ignore-vuln 并回归。豁免清单须与本注释同步
          # 留痕（既定政策：不降级 continue-on-error）。
          pip-audit --strict --no-deps \
            --ignore-vuln PYSEC-2026-165 \
            --ignore-vuln PYSEC-2026-2249 \
            --ignore-vuln PYSEC-2026-2250 \
            --ignore-vuln PYSEC-2026-2251 \
            --ignore-vuln PYSEC-2026-2252 \
            --ignore-vuln PYSEC-2026-2253 \
            --ignore-vuln PYSEC-2026-2254 \
            --ignore-vuln PYSEC-2026-2255 \
            --ignore-vuln PYSEC-2026-2256 \
            --ignore-vuln PYSEC-2026-2257 \
            --ignore-vuln PYSEC-2026-2874 \
            --ignore-vuln PYSEC-2026-3451 \
            --ignore-vuln PYSEC-2026-3453 \
            --ignore-vuln PYSEC-2026-3454 \
            --ignore-vuln PYSEC-2026-3493 \
            --ignore-vuln PYSEC-2026-3494 \
            --ignore-vuln PYSEC-2026-3495 \
            --ignore-vuln PYSEC-2026-3496 \
            -r requirements-lock.txt --progress-spinner off -f json -o pip-audit-report.json
      - name: Upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-artifacts
          path: |
            requirements-lock.txt
            sbom.json
            pip-audit-report.json
          if-no-files-found: warn
