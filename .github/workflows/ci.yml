# rfauto CI
#
# 三级测试标签语义：
#   unit             —— tests/unit，无 EDA 依赖即可跑（fake 通道覆盖全部核心逻辑）
#   integration-fake —— fake 档集成（本仓当前归并在 tests/unit 内，同 job 覆盖）
#   real_edt         —— 真机 AEDT/ADS 路径，pytest marker `real_edt` 标记；
#                       CI 上永远以 `-m "not real_edt"` 排除，配静态 marker
#                       census 守卫（W3-4）保证标记面不漂移，不执行
#
# Linux runner 是唯一允许的非 Windows 环境（用户环境约束：本机不做 Linux 适配）。
#
# 变更面感知（2026-10-26）：`changes` job 先判定本次推送的变更面——
#   文档-only（README/docs/docs_site/CHANGELOG 等）→ 只跑 quality（数字链/
#   编码/敏感扫描）+ docs-drift，跳过 pytest 四分片/preflight/供应链/docker；
#   任何代码面变更（src/tests/recipes/scripts/configs/…）→ 全矩阵照跑。
#   逃生口：commit message 含 [full-ci]，或 workflow_dispatch 勾选 full_ci，
#   或拿不到可比基线（新分支/force push）→ 一律全跑。未识别路径按代码面
#   处理（fail-safe：宁可多跑，不可漏跑）。判定器=scripts/ci_change_scope.py。
#
# 安装链收敛（2026-10-28 W3-1）：各 job 的 setup-python+pip 安装步统一走
# 仓内 composite action ./.github/actions/setup-rfauto（uv 钉版 0.12.17
# 加速；原 `pip install -e .` 安装步实测 2-4min/处，PLAN §〇——push 后
# 按各 job 安装步实测回填）。
#
# 分片与守卫四件（2026-10-28 W3-3~W3-6）：
#   W3-3 preflight 瘦身——对账后只保留 8 个独有真树审计面（17 个重复面
#     删除：check_numbers=quality 同脚本、public_api 金快照/pytest 漂移面/
#     扩面六组=test 分片全量覆盖、pip-audit=supply-chain 更严口径、help
#     括号 AST=test 分片真树同口径 pytest；对账清单
#     runs/aurora_m/w3_3_6/w3_3_unique_faces_ledger.md）；
#   W3-4 real_edt 全量 collect 步（25min 饥饿前科）改静态 marker census
#     （秒级；盘面/标记计数互证 + 棘轮下限 + unit 面零标记三守卫）；
#   W3-5 test 分片 2→4 + 重件静态锚定表（durations manifest 口径 dur>=15s
#     共 55 件 LPT 四片，轻件字母序 NR%4 均分；sum 失衡 4.5% vs 字母序
#     直推 24.1%，证据 runs/aurora_m/w3_3_6/w3_5_*.txt）；
#   W3-6 分片失败 --lf 自动重跑一次：绿=job summary 标 RETRIED_GREEN
#     （环境类嫌疑定性器），仍红=保持红——#122 红线：重试不凑绿，红即红。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      full_ci:
        description: "Force the full matrix (ignore the docs-only fast path)"
        type: boolean
        default: true
  schedule:
    # 活规则周期重跑（K1）：每周一 03:00 UTC 复跑 rules.yaml verify
    # 验证测试，防综合引擎（skrf/scipy）或依赖版本漂移使定案值失真。
    # （rules-verify 用 github.event.schedule 锁定本条触发，日触发不跑）
    - cron: "0 3 * * 1"
    # 文档再生漂移日检：docs_site/kernel_cards 重生成产物 vs 已提交
    # 逐字节比对（test_docs_site/test_kernel_cards，与 merge_preflight
    # 同判据同源），漂移即 job 红——防站点产物静默落后于代码面。
    # （docs-drift 用 github.event.schedule 锁定本条触发；两个触发器
    # 按调度串分轨，互不串扰）
    - cron: "30 2 * * *"

# W3-7（2026-10-28）workflow 级并发控制：
#   group —— push/PR 按 ref 分组（同分支/同 PR 天然同组）；schedule 事件按
#   cron 串单独分轨（github.event.schedule 在 schedule 事件下=cron 表达式
#   本身，其余事件为 null 走 || github.ref 回落）——每日 docs-drift 与每周
#   rules-verify 各自成组，夜门/周门既不与 main push 抢组排队，也不会被
#   任何同仓活动取消（无人值守门，取消即静默丢门）。
#   cancel-in-progress —— 表达式直接产出原生布尔（GitHub 官方支持表达式
#   取值，docs "cancel-in-progress … as an expression"）：仅 PR 事件为 true
#   （同 PR 二次 push 取消同组旧 run），push/dispatch/schedule 均为 false
#   （main push 排队不取消）。
#   布尔化坑注记：切勿写三元拼字符串 'false' 的形态——表达式结果若是非空
#   字符串则为 truthy，"不取消"会被反转成"取消"；必须保持 ${{ == }} 比较
#   的原生布尔形态。
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && github.event.schedule || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: change scope (docs-only fast path)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
      code: ${{ steps.scope.outputs.code }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要推送前的 commit 才能算变更面（push 事件 before..HEAD）
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_HEAD_MSG: ${{ github.event.head_commit.message }}
          CI_FORCE_FULL: ${{ github.event.inputs.full_ci }}
        # fail-safe：判定器自身出错时回落「全跑」——绝不让重 job 因判定失败
        # 被静默跳过（跳过=真门不开，比慢 30 分钟危险得多）。
        run: |
          python scripts/ci_change_scope.py || {
            echo "change-scope classifier failed; defaulting to FULL matrix"
            {
              echo "docs=true"
              echo "code=true"
              echo "full=true"
            } >> "$GITHUB_OUTPUT"
          }

  quality:
    name: lint + contracts + numbers + encoding + sensitive
    runs-on: ubuntu-latest
    # timeout-minutes（W3-2，2026-10-28）：GitHub 缺省 360min=挂起放大器。
    # 实测近 20 次成功 run（runs/aurora_m/w3_2_7/job_durations.json）：
    # median 0.76 / P99≈max 1.12min（n=20）→ P99×2≈2.2，与 PLAN 建议档
    # 取大者=15。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # W3-1（2026-10-28）安装链收敛：原 setup-python+pip 两步走仓内
      # composite action。check_numbers 会 import rfauto.cli 实测命令数——
      # src 布局需要可安装态，且必须带核心依赖（typer 等被 import，
      # --no-deps 会 ModuleNotFoundError），editable 安装由 action 承担。
      - name: Install package and quality toolchain (uv)
        uses: ./.github/actions/setup-rfauto
        with:
          # 基础安装不带 extras（与原 `pip install -e .` 等价）
          extras: ""
          # 质量门工具钉版=本地门实测（2026-09-22 立规：浮动 latest 版本漂移
          # 如 ruff 新增 I001 检查会 CI 红/本地绿；ruff 0.16.6 /
          # import-linter 2.15 为本地 venv 实测版本）。
          extra-packages: "ruff==0.16.6,import-linter==2.15,pyyaml"
          # 依赖缓存 key 按依赖声明文件哈希（pyproject.toml 是安装解析的
          # 实际来源；uv.lock 有代际滞后不作 key）。缓存只加速下载，陈旧无害。
          cache-dependency-path: pyproject.toml
      - name: ruff (src/ tests/ scripts/)
        run: ruff check src/ tests/ scripts/
      - name: import-linter contracts
        run: lint-imports --config .importlinter
      - name: number self-check (README vs code)
        run: python scripts/check_numbers.py
      - name: UTF-8 no-BOM encoding check
        run: python scripts/check_encoding.py
      - name: palace wrapper pinned-content check (graceful skip when assets absent)
        run: |
          if [ -f tools/palace-install/bin/palace.cmd ]; then
            python scripts/palace_wsl_wrapper.py --check
          else
            echo "palace wrapper assets not installed (tools/ is not in git); skipping check"
          fi
      - name: sensitive content scan
        run: python scripts/scan_sensitive.py

  test:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # 名字静态化：job 级 if 未通过时 matrix 不展开，名字里带 matrix 变量会
    # 显示成裸表达式；shard 号由 step 名与日志体现。
    name: pytest (unit + integration-fake, no EDA)
    runs-on: ubuntu-latest
    # 四分片（W3-5，2026-10-28）：套件扩到 27642 后单 job 连续两轮被
    # runner 外杀（run 39936814053 在 82% 处 exit 143、run 39945200918 主
    # step 悬挂至 job 判死）——2026-10-13 拆两片后片间实测仍失衡 ~20-30%
    # （(1) 33.35min vs (2) 27.87min、shard1/2 24.06 vs 31.27，
    # per_job_distributions）。2→4 片把单片体量再对半，同时按内部仓
    # durations manifest（junitxml per-testcase 时长聚合文件级，75.7min
    # 口径）把 **dur>=15s 的 55 个重件文件 LPT 静态锚定到片（各片
    # heavy_sum=827s 逐位相等）**、其余 1090 个轻件（各 <15s）字母序
    # NR%4 均分——sum 失衡 4.5%（max/min=1.047），xdist -n2 墙钟模拟
    # 失衡同为 4.5%；字母序直推 NR%4 失衡 24.1% 不达 20% 门口径故加
    # 锚定层。证据=runs/aurora_m/w3_3_6/w3_5_shard_balance_analysis*.txt
    # + w3_5_anchor_table_design.txt。维护纪律：新增文件本地实测 >=15s
    # （或并入 tier C 重件层）必须重切锚定表（重切法同证据目录）；
    # 锚定文件改名/删除由步内存在性守卫当场拦下。
    # fail-fast 关闭保证四片都跑完一次拿全失败面。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      # W3-1（2026-10-28）安装链收敛（同 quality）：uv composite action。
      - name: Install package with test-relevant extras (uv)
        uses: ./.github/actions/setup-rfauto
        with:
          # dev 组含离线套件全部可选内核（smt/pyarrow/duckdb/gdstk/scikit-learn…），
          # 缺位时相应测试组 fail 而非 skip
          extras: "hfss,mcp,multiobj,dev"
      - name: Install CJK fonts for report_render PDF tests
        run: |
          # CJK 字体：report_render PDF 测试（typst 嵌字+pypdf 抽取 CJK 段
          # 标题）。runner 缺省无 Noto CJK → typst 无 CJK 字形可嵌，抽取
          # 全为 \x00（2026-10-07 CI 首跑实证）——装系统字体供
          # report_render._font_paths 的 /usr/share/fonts 扫描面拾取
          # （模板字体表第三顺位 "Noto Sans CJK SC"）。apt 系统包非 pip
          # 面，留独立步不进 composite action。
          # apt 源（security.ubuntu.com）DNS 解析在 runner 上持续失败
          # （run 43043514281 三试全败，"Temporary failure resolving"
          # =非瞬态）——主路换 GitHub 直拉单字体 OTF（notofonts/noto-cjk
          # Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf，16.4MB，
          # 族名 "Noto Sans CJK SC"=模板字体表第三顺位；checkout 同域已证
          # 可达），apt 三试留作 fallback；装后强终验（两通道全空即红）。
          mkdir -p ~/.fonts-fallback
          curl -fsSL --retry 3 --retry-delay 10 -o ~/.fonts-fallback/NotoSansCJKsc-Regular.otf \
            https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf \
            || echo "github font fetch failed, fall back to apt"
          ok=""
          if [ -s ~/.fonts-fallback/NotoSansCJKsc-Regular.otf ]; then
            sudo mkdir -p /usr/share/fonts/opentype/noto-cjk-gh
            sudo mv ~/.fonts-fallback/NotoSansCJKsc-Regular.otf \
              /usr/share/fonts/opentype/noto-cjk-gh/
            ok=1
          else
            for i in 1 2 3; do
              if sudo apt-get update -qq && sudo apt-get install -y -qq \
                  --no-install-recommends fonts-noto-cjk; then
                ok=1; break
              fi
              echo "apt attempt $i failed (mirror/DNS), retry in 20s"
              sleep 20
            done
          fi
          if [ "$ok" != "1" ]; then
            echo "no font channel succeeded (github fetch + apt retries)"
            exit 1
          fi
      - name: Run unit + integration-fake tests (real_edt deselected, 4-shard balanced, --lf retry once)
        run: |
          # ── W3-5 分片选择：重件锚定表 + 轻件字母序均分 ─────────────────
          # 锚定表（54 件=manifest dur>=15s 原 55 件减 test_pool_patrol.py——
          # 2026-11-02 脱敏删除（c3cb5fa，内部湖快照夹具不出公开仓），S2 少
          # 一重件未重切（单件 ≥15s 量级 vs 827s 片和，失衡增量个位数百分点，
          # 仍在 20% 门内；下次重切随 durations manifest 刷新）；重切法与
          # 均衡证据同 runs/aurora_m/w3_3_6/）。表内文件改名/删除/移出
          # tests/unit 由下方存在性守卫当场红——重切或同步表后方可合流。
          HEAVY_S1="test_synthesis_bpf_polish_backsub.py test_public_api.py test_factory_m2_rejudge_merged.py test_w3_e_quantized_milp.py test_factory_g2_judge_2d.py test_w5_a_knowledge_bus.py test_hfss_window_driver.py test_si_channel_service.py test_ta_wave_a_templates.py test_dataset_service_query.py test_w2_a_campaign.py test_check_docs_drift.py test_c3_fullcurve_runner.py test_w6_e_i04_split_pin.py"
          HEAVY_S2="test_coil_nfc_template.py test_mf_surrogate_loop.py test_kernel_cards.py test_w2_c_json_coverage.py test_coupling_matrix.py test_dp11_vna_wiring.py test_sicl_line.py test_mapes_probe.py test_result_cache_wiring.py test_v1_calibration.py test_optimization.py test_p0_experiment.py"
          HEAVY_S3="test_w2_d_xd9.py test_w3_c_registry_e2e.py test_sensitivity_rankings_registry.py test_wp34_neural_operator_ab.py test_r8_eng2_ui_registry.py test_trust_region.py test_w3_e_array_synth.py test_mf_backend_resume.py test_ta_wave_c_templates.py test_factory_mf_rejudge.py test_r3_extensions.py test_cli.py test_ui_auth.py test_sra.py"
          HEAVY_S4="test_hierarchical_scheduler.py test_wp39_benchmark.py test_w4_a_sm_core.py test_c3_spurious_modes.py test_factory_m2_judge_2d.py test_surrogate_loop.py test_pydantic_ai_runtime.py test_league_service.py test_smt_kriging.py test_factory_mfk_lowfi_fix.py test_output_sm_service.py test_dataset_insights.py test_aurora_e_s9_mtrl_uc.py test_self_verify.py"
          SHARD="${{ matrix.shard }}"
          case "$SHARD" in
            1) HEAVY="$HEAVY_S1" ;;
            2) HEAVY="$HEAVY_S2" ;;
            3) HEAVY="$HEAVY_S3" ;;
            4) HEAVY="$HEAVY_S4" ;;
          esac
          # 轻件池排除面=四表合集（跨片一致）——四片并集恰为全树一次覆盖。
          ANCHORED_ALL="$HEAVY_S1 $HEAVY_S2 $HEAVY_S3 $HEAVY_S4"
          for bn in $HEAVY; do
            [ -f "tests/unit/$bn" ] || { echo "::error ::W3-5 anchored heavy file missing - tests/unit/$bn (re-cut the anchor table)"; exit 1; }
          done
          FILES=""
          for bn in $HEAVY; do FILES="$FILES tests/unit/$bn"; done
          # 轻件：字母序 NR%4 均分（各轻件 <15s，计数均分误差可忽略；
          # idx 对全体轻件计数保证四片选取互斥且并集完备）。
          idx=0
          for bn in $(cd tests/unit && ls test_*.py | sort); do
            case " $ANCHORED_ALL " in *" $bn "*) continue ;; esac
            idx=$((idx + 1))
            if [ $(( (idx - 1) % 4 + 1 )) -eq "$SHARD" ]; then
              FILES="$FILES tests/unit/$bn"
            fi
          done
          n_heavy=$(printf '%s\n' $HEAVY | wc -w)
          n_all=$(printf '%s\n' $FILES | wc -w)
          echo "shard $SHARD - $n_all files (heavy $n_heavy + light $((n_all - n_heavy)))"
          # xdist loadfile 并行：内部仓 gate_parallel.py 先例直接搬
          # （8.55× 实测，2026-09-25 df6 批）；loadfile 按测试文件分组
          # 分发，不破坏文件内顺序依赖。真跑/重型 job 本 CI 不存在
          # （real_edt 恒被 deselect），故只有本纯单测 job 并行；
          # rules-verify 单文件 cron job 保持串行。
          # OPENBLAS_NUM_THREADS=1：xdist worker×BLAS 线程超订实测慢
          # 85×（内部 #258），必须在 pytest/numpy import 前生效。
          # -n 2（不用 auto）：7GB runner 上 worker 过多曾致尾部 OOM——
          # worker 被 kill 时 pytest 汇总零 failed 但退出码打穿为 1
          # （2026-10-13 run 37 实证），钉死并行度消除该变量。
          # 失败面经 ::error:: annotation 公开可读（诊断期；稳定后可收）。
          set +e  # runner 默认 bash -e 会在首个非零命令处腰斩脚本，rc/重试/注解/summary 手工序列必须自管（W3-6）
          python -m pytest $FILES -q -m "not real_edt" -n 2 --dist=loadfile 2>&1 | tee /tmp/unit.log
          rc=${PIPESTATUS[0]}
          grep -E "^FAILED" /tmp/unit.log | head -12 | while IFS= read -r line; do
            echo "::error ::$line"
          done
          tail -3 /tmp/unit.log > "${GITHUB_STEP_SUMMARY}"
          # 失败面计数走日志汇总口径（非退出码——xdist 异常态家法见下）。
          n_failed=$(grep -Eo "[0-9]+ failed" /tmp/unit.log | awk '{s+=$1} END {print s+0}')
          n_errors=$(grep -Eo "[0-9]+ errors?" /tmp/unit.log | awk '{s+=$1} END {print s+0}')
          sec_err=0; grep -q "= ERRORS =" /tmp/unit.log && sec_err=1
          # 门判据=日志汇总内容而非退出码：2026-10-13 run 37/38 实证
          # pytest-xdist「零 failed 零 error 却 exit 1」异常态（全绿汇总 +
          # 退出码打穿；-n auto/-n 2 皆现，本地 Linux 外无法复现）——
          # 零 failed 零 error 时响亮标注后放行，真实失败照常红。
          if [ "$rc" -ne 0 ] && [ "$n_failed" -eq 0 ] && [ "$n_errors" -eq 0 ] && [ "$sec_err" -eq 0 ]; then
            echo "::warning::pytest exit=$rc but summary shows zero failed/errors (xdist exit-code anomaly, runs 37/38) - gate reads the log summary; see numpy/scipy/sklearn versions below for drift forensics"
            .venv/bin/python -m pip list 2>/dev/null | grep -iE "^(numpy|scipy|scikit-learn|skrf|pydantic) " >> "${GITHUB_STEP_SUMMARY}" || true
            exit 0
          fi
          # ── W3-6 失败重试标注（2026-10-28）────────────────────────────
          # #122 红线（写死勿删）：--lf 重试只是环境类定性器——首跑红、
          # 失败集重跑一次绿 = 环境类嫌疑（flaky/内存/调度噪声），在 job
          # summary 标 RETRIED_GREEN 留痕供盘点；**重跑仍红=保持红，红即
          # 红，重试永不改门判据、永不用重试凑绿**。重跑只跑失败集
          # （pytest --lf 读首跑写入的 .pytest_cache/lastfailed，同工作
          # 目录同 step 内生效）；失败集无法重选（no tests ran）=保持红。
          if [ "$rc" -ne 0 ]; then
            echo "first run red (rc=$rc, failed=$n_failed, errors=$n_errors) - retrying the failed set once with --lf (W3-6 env-class classifier, #122 - red is red)"
            python -m pytest $FILES -q -m "not real_edt" -n 2 --dist=loadfile --lf 2>&1 | tee /tmp/unit_lf.log
            rc2=${PIPESTATUS[0]}
            nf2=$(grep -Eo "[0-9]+ failed" /tmp/unit_lf.log | awk '{s+=$1} END {print s+0}')
            ne2=$(grep -Eo "[0-9]+ errors?" /tmp/unit_lf.log | awk '{s+=$1} END {print s+0}')
            sec2=0; grep -q "= ERRORS =" /tmp/unit_lf.log && sec2=1
            empty2=0; grep -q "no tests ran" /tmp/unit_lf.log && empty2=1
            if [ "$nf2" -eq 0 ] && [ "$ne2" -eq 0 ] && [ "$sec2" -eq 0 ] && [ "$empty2" -eq 0 ]; then
              # 失败集重跑绿（含 rc2≠0 的 xdist 异常态——失败集确已通过，
              # 退出码不可信按家法放行，同样留 RETRIED_GREEN 标注）。
              if [ "$rc2" -ne 0 ]; then
                echo "::warning::pytest rerun exit=$rc2 but summary shows zero failed/errors (xdist exit-code anomaly, runs 37/38) - gate reads the log summary"
              fi
              echo "RETRIED_GREEN (env-class suspect): first run failed=$n_failed/errors=$n_errors, --lf rerun green. #122 - retry is an env-class classifier, not a gate-loosener." >> "${GITHUB_STEP_SUMMARY}"
              tail -3 /tmp/unit_lf.log >> "${GITHUB_STEP_SUMMARY}"
              echo "::warning::RETRIED_GREEN (env-class suspect) - first-run failures passed on the --lf rerun (W3-6/#122), see job summary"
              exit 0
            fi
            # 仍红 = 保持红（#122：红即红）。
            grep -E "^FAILED" /tmp/unit_lf.log | head -12 | while IFS= read -r line; do
              echo "::error ::$line"
            done
            tail -3 /tmp/unit_lf.log >> "${GITHUB_STEP_SUMMARY}"
            if [ "$nf2" -gt 0 ] || [ "$ne2" -gt 0 ] || [ "$sec2" -eq 1 ] || [ "$empty2" -eq 1 ]; then
              exit 1
            fi
            exit "$rc2"
          fi
          exit "$rc"
        env:
          OPENBLAS_NUM_THREADS: "1"
      - name: Static real_edt marker census (W3-4, replaces the full-collect step)
        run: |
          # W3-4（2026-10-28）：原步 `pytest tests/unit -m "real_edt" --co -q`
          # 是全量收集（1145 文件/2.2 万测试，2 核 runner 收集面有 25min 级
          # 饥饿前科），且它断言的集合是空的——tests/unit 现状零 real_edt
          # 标记使用（真机测试全部在 tests/real_edt/，12 个 test 文件
          # pytestmark = pytest.mark.real_edt；CI test job 本就不跑该目录）。改静态
          # marker census 守卫（秒级、零 pytest）：
          #   ① 盘面互证——tests/real_edt 磁盘 test 文件数 == 带
          #      mark.real_edt 的文件数：新文件漏标/笔误当场红（合法新增
          #      两数同涨，无需改常量）；
          #   ② 棘轮下限——标记文件数 >= EXPECTED_MIN（只收不放，防标记
          #      面静默缩水；上调须注记）；
          #   ③ unit 面零标记——tests/unit 出现 mark.real_edt 即红：unit
          #      套件必须 EDA-free，真机标记测试混入会被 CI 的
          #      `-m "not real_edt"` 静默 deselect = 覆盖黑洞；
          #   ④ 常见笔误黑名单——realedt/real_edtt/real-edt/RealEdt 零
          #      容忍（笔误标记不被 deselect，CI 会真跑真机测试）。
          set +e
          EXPECTED_MIN=12   # 锚定 2026-10-28 实测（tests/real_edt 12 个 test 文件全带标记；conftest.py 文档串提及 marker 不算）；只收不放
          disk=$(ls tests/real_edt/test_*.py 2>/dev/null | wc -l)
          marked=$(grep -lE "mark\.real_edt" tests/real_edt/test_*.py 2>/dev/null | wc -l)
          unit_hits=$(grep -rlE "mark\.real_edt" tests/unit 2>/dev/null | wc -l)
          typos=$(grep -rnE "mark\.(realedt|real_edtt|real-edt|RealEdt)" tests 2>/dev/null | wc -l)
          echo "real_edt census - disk=$disk marked=$marked unit_hits=$unit_hits typos=$typos (ratchet floor=$EXPECTED_MIN)"
          rc=0
          if [ "$disk" -eq 0 ]; then
            echo "::error ::tests/real_edt has no test files - real-machine marker suite missing?"; rc=1
          fi
          if [ "$disk" -ne "$marked" ]; then
            echo "::error ::tests/real_edt marker census mismatch - $disk file(s) on disk vs $marked carrying mark.real_edt (missing/typo marker, W3-4)"; rc=1
          fi
          if [ "$marked" -lt "$EXPECTED_MIN" ]; then
            echo "::error ::real_edt marker files $marked < ratchet floor $EXPECTED_MIN (只收不放，上调须注记)"; rc=1
          fi
          if [ "$unit_hits" -ne 0 ]; then
            echo "::error ::tests/unit must stay EDA-free - $unit_hits file(s) use mark.real_edt (real-machine tests belong in tests/real_edt; a marked unit test is silently deselected by CI -m not real_edt)"; grep -rlE "mark\.real_edt" tests/unit; rc=1
          fi
          if [ "$typos" -ne 0 ]; then
            echo "::error ::marker typo blacklist hit x$typos - a misspelled marker is NOT deselected and would run real-machine tests on CI"; grep -rnE "mark\.(realedt|real_edtt|real-edt|RealEdt)" tests; rc=1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "real_edt census OK - tests/real_edt (real AEDT/ADS suite) is marker-complete and never executed on CI (test job runs tests/unit only)."
          fi
          exit $rc

  preflight:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: preflight unique-face audits (AST/meta quick scans)
    # W3-3（2026-10-28）瘦身：原形态裸跑 scripts/merge_preflight.py（25 面，
    # CI 实测 median 11.97 / P99 15.67min，n=15）——对账后发现 17/25 面与
    # quality / test / supply-chain 三 job 严格重复：pytest 漂移面 10 目标
    # +扩面六组 13 文件全在 tests/unit（test 四分片本就全量跑）；check_
    # numbers=quality 同脚本步；public_api 金快照 --check=test 分片
    # test_public_api.py::test_real_tree_check_gold_passes 真树同判据；
    # help 括号 AST=test 分片 test_cli_help_text_hygiene.py::
    # TestParamHelpTextHygiene 真树同口径（脚本头注"双机制同口径"）；
    # pip-audit 快审=supply-chain job pip-audit --strict 更严口径。重复面
    # 只贡献"早失败"安慰收益，却独占一条安装链+11min 墙钟。瘦身后保留
    # 8 个独有真树审计面（一条不少）：
    #   11 sleep-AST 常驻守卫（audit_test_sleeps.py，tests 树零 sleep(N>10)）
    #   13 几何 API 字面算术审计（audit_literal_arithmetic_geometry.py，#218）
    #   14 锚 freshness 审计（audit_anchor_freshness.py，棘轮只收不放）
    #   15 模板 meta 健康度 5 维审计（audit_template_meta.py）
    #   16 runs 湖 registry 落后度（registry_backfill --check；CI 树无湖
    #      =rc2 SKIP 诚实降级，保留语义成本 ~1s）
    #   17 MCP 描述单源门（check_mcp_desc.py 五维；装 mcp extra 保其
    #      常驻可执行，不退化成恒 SKIP）
    #   18 UI 前后端契约棘轮门（check_ui_contracts.py 双向对账）
    #   25 U+FFFD 替换字符抽查（quality 的 check_encoding 只盖 BOM/非
    #      UTF-8 可解码，不盖合法 UTF-8 的 EF BF BD 序列——此面独有，
    #      #89/#259）
    # 本地实测 8 面合计 8.0s、提取步端到端 9s（runs/aurora_m/w3_3_6/
    # audit_timing_dryrun.txt；2 核 CI x3 余量仍 <<1min），安装面从 dev
    # 全家桶缩到 core+mcp+pyyaml——PLAN 验收口径 job ≤3min 达成路径。
    # rc 语义对齐原脚本：0=绿 /
    # 1=红 / 2=SKIP 诚实降级（warning 不红）；#122 三分法不变。
    # 注：被删 pytest 条件面在内部仓 merge_preflight --scope 语义（commit
    # 2827c7ac）本就属"条件面"，常驻脚本审计面（本步保留集）不参与变更面
    # 跳过——本形态与 scope=auto 语义天然对齐；将来公开仓同步 tiered
    # merge_preflight 后，本步直接调各审计脚本的接口不受影响。
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package with mcp extra plus pyyaml (uv)
        uses: ./.github/actions/setup-rfauto
        with:
          # 瘦身后不再跑 pytest 面（dev/hfss/multiobj 全免）：core 可安装态
          # 供 rfauto.infra / rfauto.mcp_server import（面 14/16/17）；
          # pyyaml 供 audit_template_meta（core 依赖不带 yaml，与 quality
          # 同款 extra-packages 显式补齐）。
          extras: "mcp"
          extra-packages: "pyyaml"
      - name: Run unique-face audits (sleep-AST, geometry, anchors, template meta, registry, mcp-desc, ui-contracts, U+FFFD)
        run: |
          # rc 汇总：任一面 rc∉{0,2} → job 红；rc=2=SKIP 诚实降级（warning
          # 不红，#122 环境类三分法）。
          set +e  # runner 默认 bash -e 会在首个非零命令处腰斩脚本，rc/注解/summary 手工序列必须自管
          : > /tmp/preflight.log
          rc_total=0
          run_face() {
            label="$1"; shift
            echo "== face - $label"
            python "$@" 2>&1 | tee -a /tmp/preflight.log
            r=${PIPESTATUS[0]}
            if [ "$r" -eq 2 ]; then
              echo "::warning::[SKIP] $label (rc=2 honest degradation, #122 env-class)"
            elif [ "$r" -ne 0 ]; then
              echo "::error ::[FAIL] $label (rc=$r)"
              rc_total=1
            fi
          }
          run_face "sleep-AST guard (no sleep(N>10) in tests)" scripts/audit_test_sleeps.py
          run_face "geometry literal-arithmetic audit" scripts/audit_literal_arithmetic_geometry.py
          run_face "anchor freshness audit" scripts/audit_anchor_freshness.py
          run_face "template meta health audit" scripts/audit_template_meta.py
          run_face "runs-lake registry backfill --check" scripts/registry_backfill.py --check
          run_face "MCP desc single-source gate" scripts/check_mcp_desc.py
          run_face "UI frontend-backend contract gate" scripts/check_ui_contracts.py
          # 面 25：U+FFFD 替换字符抽查（#89/#259 常驻化；扫描面/判定与
          # merge_preflight 原面 25 同判据——文本扩展名白名单 rglob）。
          python - <<'PYEOF' 2>&1 | tee -a /tmp/preflight.log
          import sys
          from pathlib import Path
          exts = {".py", ".md", ".txt", ".yaml", ".yml", ".toml", ".cfg",
                  ".ini", ".json", ".js", ".css", ".html"}
          hits = []
          for root in ("src", "scripts", "tests", "docs"):
              for p in Path(root).rglob("*"):
                  if p.suffix.lower() not in exts or not p.is_file():
                      continue
                  try:
                      n = p.read_bytes().count(b"\xef\xbf\xbd")
                  except OSError:
                      continue
                  if n:
                      hits.append(f"{p.as_posix()} x{n}")
          if hits:
              print("[FAIL] U+FFFD content scan (#89/#259) - replacement chars in text face:")
              for h in hits[:20]:
                  print("  " + h)
              sys.exit(1)
          print("[PASS] U+FFFD content scan (src/scripts/tests/docs text face clean)")
          PYEOF
          r=${PIPESTATUS[0]}
          if [ "$r" -ne 0 ]; then
            echo "::error ::[FAIL] U+FFFD content scan (rc=$r)"
            rc_total=1
          fi
          tail -10 /tmp/preflight.log > "${GITHUB_STEP_SUMMARY}"
          exit $rc_total

  licenses:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: license compliance gate (P-3 pip-licenses)
    runs-on: ubuntu-latest
    # timeout-minutes（W3-2，2026-10-28）：实测 median 0.85 / P99≈max 1.27min
    # （n=15）→ P99×2≈2.5，与 PLAN 建议档取大者=15。证据同 quality。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # W3-1（2026-10-28）安装链收敛（同 quality）：uv composite action。
      # 注：本 job 原先 setup-python 未开 pip 缓存，收敛后随 action 缺省
      # cache=true 获得缓存（仅加速下载，无害——口径偏差已对账）。
      - name: Install package and license gate tool (uv)
        uses: ./.github/actions/setup-rfauto
        with:
          # pip-licenses 钉版：5.5.5 起读取 PEP 639 license SPDX 表达式（自包
          # rfauto GPL-3.0 才入扫）——浮动升级会静默改变扫描口径（run 38839481077
          # 实证），与本地门版本保持一致（CI 工具钉版家法）。本 job 不进
          # dev extra（重依赖面），pytest 单独补齐。
          extras: "hfss,mcp,multiobj"
          extra-packages: "pytest,pip-licenses==5.5.5"
      - name: Run license compliance gate (scripts/license_gate.py, ALLOWED+EXEMPT 表)
        run: python scripts/license_gate.py

  rules-verify:
    name: live rules periodic re-verify (K1, weekly cron only)
    runs-on: ubuntu-latest
    # timeout-minutes（W3-2，2026-10-28）：实测仅 1 个成功样本 1.97min
    # （weekly cron 窗口内只触发一次），P99×2≈4 样本过薄；PLAN 建议档无
    # 本 job 条目。无人值守周门取保守 30min：与 preflight 同口径（含 pip
    # 缓存未命中时重装 dev extras 的冷启动余量——本 job 职责恰是抓依赖
    # 漂移，安装面本身就该留裕度）。
    timeout-minutes: 30
    # 只在周一 03:00 UTC 的 weekly 触发跑（push/PR 由 test job 覆盖同一批
    # 测试；每日 02:30 触发归 docs-drift，按调度串分轨互不串扰）
    if: github.event.schedule == '0 3 * * 1'
    steps:
      - uses: actions/checkout@v4
      # W3-1（2026-10-28）安装链收敛（同 quality）：uv composite action。
      - name: Install package with test-relevant extras (uv)
        uses: ./.github/actions/setup-rfauto
        with:
          extras: "hfss,mcp,multiobj,dev"
      - name: Re-run live rules verify tests (rules.yaml verify subset)
        run: |
          # 单测试文件串行：xdist 分发无收益（loadfile 下单文件=单 worker），
          # 定案值复验保持确定性顺序。
          python -m pytest tests/unit/test_rules_verify.py -q -m "not real_edt"

  docs-drift:
    name: docs_site regeneration drift (daily schedule or docs-only push)
    needs: changes
    runs-on: ubuntu-latest
    # timeout-minutes（W3-2，2026-10-28）：两触发面合并计（n=8）——docs-only
    # push（n=7，median 8.73 / max 11.28，跳过 kernel_cards）+ 每日 schedule
    # （n=1，13.62，含 kernel_cards 再生 ~7min）；族 P99≈max 13.62 → ×2≈27.2，
    # 与 PLAN 建议档 20 取大者=27.2 → 取整 30。
    timeout-minutes: 30
    # 两路触发：①每日 02:30 UTC 定时（周一 03:00 weekly 归 rules-verify）；
    # ②文档-only 推送（fast path 下 test 分片被跳过，站点再生由本 job 兜住）。
    if: >-
      github.event.schedule == '30 2 * * *' ||
      (needs.changes.outputs.full == 'false' && needs.changes.outputs.docs == 'true')
    steps:
      - uses: actions/checkout@v4
      # W3-1（2026-10-28）安装链收敛（同 quality）：uv composite action。
      - name: Install package with test-relevant extras (uv)
        uses: ./.github/actions/setup-rfauto
        with:
          # 与 test job 同依赖面——再生成结果随依赖版本漂移正是本 job
          # 要抓的对象，审计面必须与真实安装集一致
          extras: "hfss,mcp,multiobj,dev"
      - name: Regenerate docs_site (and kernel_cards on code pushes), diff against committed
        run: |
          # 再生差异判据=仓内既有测试（与 merge_preflight 的 docs 面同
          # 判据同源，零新脚本）：重生成到临时目录 vs 已提交产物逐字节
          # 比对。红=站点/内核卡落后于代码面或源文档——修复=仓根重跑
          # 对应生成器并同笔提交产物，勿手改产物。
          #
          # 快车道（docs-only）跳过 kernel_cards：其输入全是代码面
          # （src docstring / knowledge/ / docs/templates 已归代码面），
          # 文档推送改不动它；该测试约 7 分钟，占本 job 大头。
          if [ "${{ needs.changes.outputs.code }}" = "true" ]; then
            python -m pytest tests/unit/test_docs_site.py tests/unit/test_kernel_cards.py -q
          else
            python -m pytest tests/unit/test_docs_site.py -q
          fi
        env:
          OPENBLAS_NUM_THREADS: "1"
      - name: Docs content gates (README numbers, citations, generated cards)
        run: |
          # 文档改动会打到的内容门全集（实测 119 条 / 14 秒）：README 数字条、
          # 文档 HTML/链接、引文、能力卡/画廊再生、待验证档、模板参考与元数据。
          # 快车道与全矩阵都跑——文档推送的"真门"就是这一组。
          python -m pytest             tests/unit/test_check_numbers.py             tests/unit/test_sync_readme_numbers.py             tests/unit/test_docs_and_html.py             tests/unit/test_check_citations.py             tests/unit/test_capability_cards_export.py             tests/unit/test_gallery_export.py             tests/unit/test_pending_verifications.py             tests/unit/test_rf_template_references_docs.py             tests/unit/test_audit_template_meta.py             -q
        env:
          OPENBLAS_NUM_THREADS: "1"

  # 容器真构建通道：每次 push/PR 在 runner 上 build 本仓 Dockerfile，并在
  # 容器内三连冒烟——①import 可导入 ②__version__ 元数据就位 ③默认入口
  # （CMD=rfauto --help）退出码 0。镜像只装核心依赖（extras 全不进镜像），
  # 故本 job 同时是「核心依赖在 linux 容器自洽」的常驻证明（CLI 入口链
  # 模块级导入零 extras，惰性 import 纪律由它背书）。构建与冒烟全用裸
  # docker 命令，除官方 checkout/buildx 外不引第三方 action。
  docker-build:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Dockerfile build smoke (C14b)
    runs-on: ubuntu-latest
    # timeout-minutes（W3-2，2026-10-28）：实测 median 0.82 / P99≈max 0.98min
    # （n=15）→ P99×2≈2；镜像层缓存全冷时 build 才显著变长，与 PLAN 建议
    # 档取大者=20。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        run: docker build -t rfauto:ci .
      - name: Container import smoke
        run: docker run --rm rfauto:ci python -c "import rfauto; print('ok')"
      - name: Container version smoke
        run: docker run --rm rfauto:ci python -c "import rfauto; print(rfauto.__version__)"
      - name: Container CLI help smoke (default CMD)
        run: docker run --rm rfauto:ci

  # ---------------------------------------------------------------------
  # supply-chain（X5 供应链卫生门，2026-09-24）
  #
  # 三件套：pip-audit 漏洞审计 + CycloneDX SBOM + uv.lock 带哈希 requirements
  # 对外导出。工具一律钉版（浮动 latest=CI 红前科，2026-09-22 立规）：
  #   pip-audit    2.10.1   requires-python >=3.10（兼容 3.12，PyPI 实测）
  #   cyclonedx-bom 7.4.0   requires-python >=3.9,<4.0（兼容 3.12，PyPI 实测）
  #   uv           0.12.17  与 uv.lock（format v1 revision 3）同管理版本
  #                         （W3-1 起由 setup-rfauto composite action 的
  #                         uv-version 缺省钉住，随安装链统一安装）
  #
  # 审计形态=发现已知漏洞即 job 红（exit 非零）。2026-09-24 本地 dry-run：
  # base 锁集（50 pin）+ 工具集 0 已知漏洞（pip 升级到 26.x 后）；extras 面
  # （pyaedt/fastmcp/pymoo/dev 链）以 CI 首跑为准——若误伤，处置=依赖升级
  # 修复或显式 pip-audit --ignore-vuln 豁免清单（豁免须在 PR 描述与本注释
  # 同步留痕），不降级为 continue-on-error。
  #
  # 锁面现状（2026-10-07 刷新）：uv.lock 已按当前 pyproject 全图重解
  # （纸面 extra pypopy PyPI 404 移出 + jax/fdtdx 加 python_version 标记
  # 解 3.10/3.11 分叉）——uv lock --check 幂等通过，--frozen 导出 688 哈希。
  # 后续依赖变更后仓主重跑 uv lock 并同笔提交即可。
  # ---------------------------------------------------------------------
  supply-chain:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: supply chain (pip-audit + CycloneDX SBOM + hashed requirements)
    runs-on: ubuntu-latest
    # timeout-minutes（W3-2，2026-10-28）：实测 median 2.13 / P99≈max 2.90min
    # （n=15）→ P99×2≈5.8；pip-audit 查 PyPI 漏洞库的网络抖动属外因变量，
    # 与 PLAN 建议档取大者=25。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # W3-1（2026-10-28）安装链收敛（同 quality）：原"Install pinned
      # supply-chain tools"+"Install package with test-relevant extras"
      # 两步收敛为一个 composite 调用（同一 uv 解析面；uv 本体由 action
      # 按 uv-version 缺省钉 0.12.17，本地干跑实证合并解析零冲突）。
      - name: Install package and supply-chain tools (uv)
        uses: ./.github/actions/setup-rfauto
        with:
          # 与 test job 同依赖面——审计与 SBOM 覆盖 CI 真实安装集。
          # 工具钉版（浮动 latest=CI 红前科，2026-09-22 立规）：
          # pip-audit 2.10.1 / cyclonedx-bom 7.4.0。
          extras: "hfss,mcp,multiobj,dev"
          extra-packages: "pip-audit==2.10.1,cyclonedx-bom==7.4.0"
      - name: Export hash-pinned requirements from uv.lock
        run: |
          # 只读导出已提交的 uv.lock（--frozen 禁止改写锁文件）。
          # uv 0.12 导出默认带 --hash（去掉才用 --no-hashes），逐 pin 带
          # sha256，可配合 pip install --require-hashes 消费。
          # 行尾 grep 是守卫：导出零哈希（计数 0，grep 退出码 1）即本步红。
          uv export --frozen --no-dev --no-emit-project --format requirements.txt -o requirements-lock.txt
          grep -c -- "--hash=" requirements-lock.txt
      - name: Generate CycloneDX SBOM (JSON)
        run: |
          # 对安装后真实环境出 SBOM（含传递依赖）；CycloneDX spec 1.6 默认；
          # --output-reproducible 稳定 artifact（按规范省略随机 serialNumber）
          cyclonedx-py environment --of json -o sbom.json --pyproject pyproject.toml --output-reproducible
      - name: pip-audit fail on known vulnerabilities
        run: |
          # 环境模式审计（安装集即审计面，含供应链工具自身）；发现已知漏洞
          # 即非零退出；机器可读报告落 pip-audit-report.json 供 artifact 留档。
          # 审计面=上一步 uv export 的带哈希锁集（--no-emit-project 已排除
          # 本项目自体）：requirements 文件模式无 editable 分发解析问题
          # （venv 模式 --skip-editable 仍报 "distribution marked as
          # editable" rc=1，2026-10-07 二跑实证）——锁集即供应链审计对象。
          #
          # pillow 11.3.0 豁免清单（2026-10-07，18×PYSEC-2026；2026-10-21
          # 扩 8×CVE-2026-112395/112397/112400/112895/112896/112897/
          # 112899/112404=同包同版本 advisory 库新增 CVE 形条目；2026-10-23
          # 再扩 15×CVE-2026-112390/112391/112392/112393/112396/112399/
          # 112401/112402/112406/112891/112892/112893/112894/112900/
          # 112901=第三批 +11×CVE-2026-96636/96637/96638/96639/96640/
          # 96641/96642/96643/96644/96778/GHSA-78g4-xqwv-q3g8（末者无 CVE
          # 别名按 GHSA id 豁免）=第四批，均为同包同版本 advisory 库增量
          # （fix 均 13.0.0），本注释即留痕处）：diff-fdtd extra 的 fdtdx→moviepy
          # 钉 pillow>=9.2.0,<12.0（冲突链 uv lock 亲证），pillow 13.0.0
          # 虽已修复全部 26 项但被该上限排除；漏洞面=PSD/PDF/FITS 等
          # **图像文件解析器**，本仓 pillow 仅作 matplotlib 栅格后端，
          # 不解析不可信图像文件。解锁条件=fdtdx/moviepy 放开 pillow<12
          # 上游升级后删除全部 --ignore-vuln 并回归。豁免清单须与本注释
          # 同步留痕（既定政策：不降级 continue-on-error）。
          # pillow 11.3.0 第五批（2026-10-26）：CVE-2026-114501/112398，
          # 修复版 13.0.0，同包同版本 advisory 库增量。
          # pillow 11.3.0 第六批（2026-11-02）：PYSEC-2026-4327/4332，修复版
          # 13.0.0，同包同版本 advisory 库增量（本地 pip-audit 2.10.1 对
          # uv export --frozen 锁集复现 "Found 2 known vulnerabilities, ignored 71
          # in 1 package"，与 CI run 41443122420 逐字同）。解锁条件不变=fdtdx/
          # moviepy 放开 pillow<12。
          # pillow 11.3.0 第七批（2026-11-11）：PYSEC-2026-4363（TIFF 编码器
          # TIFFSetField 参数类型不匹配，fix 13.0.0），同包同版本 advisory 库
          # 增量（本地 pip-audit 2.10.1 对 uv export --frozen 锁集复现
          # "Found 1 known vulnerability, ignored 73 in 1 package"，与 CI run
          # 43043071700 逐字同）。解锁条件不变。
          pip-audit --strict --no-deps \
            --ignore-vuln PYSEC-2026-165 \
            --ignore-vuln PYSEC-2026-2249 \
            --ignore-vuln PYSEC-2026-2250 \
            --ignore-vuln PYSEC-2026-2251 \
            --ignore-vuln PYSEC-2026-2252 \
            --ignore-vuln PYSEC-2026-2253 \
            --ignore-vuln PYSEC-2026-2254 \
            --ignore-vuln PYSEC-2026-2255 \
            --ignore-vuln PYSEC-2026-2256 \
            --ignore-vuln PYSEC-2026-2257 \
            --ignore-vuln PYSEC-2026-2874 \
            --ignore-vuln PYSEC-2026-3451 \
            --ignore-vuln PYSEC-2026-3453 \
            --ignore-vuln PYSEC-2026-3454 \
            --ignore-vuln PYSEC-2026-3493 \
            --ignore-vuln PYSEC-2026-3494 \
            --ignore-vuln PYSEC-2026-3495 \
            --ignore-vuln PYSEC-2026-3496 \
            --ignore-vuln CVE-2026-112395 \
            --ignore-vuln CVE-2026-112397 \
            --ignore-vuln CVE-2026-112400 \
            --ignore-vuln CVE-2026-112895 \
            --ignore-vuln CVE-2026-112896 \
            --ignore-vuln CVE-2026-112897 \
            --ignore-vuln CVE-2026-112899 \
            --ignore-vuln CVE-2026-112404 \
            --ignore-vuln CVE-2026-112390 \
            --ignore-vuln CVE-2026-112391 \
            --ignore-vuln CVE-2026-112392 \
            --ignore-vuln CVE-2026-112393 \
            --ignore-vuln CVE-2026-112396 \
            --ignore-vuln CVE-2026-112399 \
            --ignore-vuln CVE-2026-112401 \
            --ignore-vuln CVE-2026-112402 \
            --ignore-vuln CVE-2026-112406 \
            --ignore-vuln CVE-2026-112891 \
            --ignore-vuln CVE-2026-112892 \
            --ignore-vuln CVE-2026-112893 \
            --ignore-vuln CVE-2026-112894 \
            --ignore-vuln CVE-2026-112900 \
            --ignore-vuln CVE-2026-112901 \
            --ignore-vuln CVE-2026-96636 \
            --ignore-vuln CVE-2026-96637 \
            --ignore-vuln CVE-2026-96638 \
            --ignore-vuln CVE-2026-96639 \
            --ignore-vuln CVE-2026-96640 \
            --ignore-vuln CVE-2026-96641 \
            --ignore-vuln CVE-2026-96642 \
            --ignore-vuln CVE-2026-96643 \
            --ignore-vuln CVE-2026-96644 \
            --ignore-vuln CVE-2026-96778 \
            --ignore-vuln GHSA-78g4-xqwv-q3g8 \
            --ignore-vuln CVE-2026-114501 \
            --ignore-vuln CVE-2026-112398 \
            --ignore-vuln PYSEC-2026-4327 \
            --ignore-vuln PYSEC-2026-4332 \
            --ignore-vuln PYSEC-2026-4363 \
            -r requirements-lock.txt --progress-spinner off -f json -o pip-audit-report.json
      - name: Upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-artifacts
          path: |
            requirements-lock.txt
            sbom.json
            pip-audit-report.json
          if-no-files-found: warn