f0_ghz: 5.8
n_ports: 4
extraction: 整 4×4 S @ LumpedPort 1-4（单激励 9 列 CSV，excite_port=1..4 进程隔离轮转装配 → .s4p，#208）+ EEPₙ @ farfield3d_cplx.csv（far_field=True，f_res=F0 固定口径，轮间同频可叠加）；互耦档判据 J4 见 runs/df6_dp4p3/criteria.md
max_time_ns: 30.0
mesh_resolution_mm: 0.0
n_segments: null
params:
- elem_len_mm
- elem_w_mm
- elem_feed_mm
- spacing_x_mm
- spacing_y_mm
- feed_w_mm
template: patch_eep_2x2
substrate:
  er: 3.66
  h_mm: 0.508
nominal_params:
  elem_len_mm: 12.9058
  elem_w_mm: 16.9311
  elem_feed_mm: 3.8717
  spacing_x_mm: 25.0172
  spacing_y_mm: 25.0172
  feed_w_mm: 1.112
topology: 2×2 EEP 贴片阵（§DP-4 P3）：栅格中心 (0,20mm)，元列 x=±dx/2、元排 y=20∓dy/2，四元同向（缺口全开 −y）；每元独立 LumpedPort 底探针（端口 1..4=行主序 x 外层 y 内层），无 corporate 馈树，元间 DC 隔离=EEP 定义性质；基板 + z-min PEC 地
param_semantics: elem_len_mm=单元谐振长 L（沿 y；Balanis Ch.14 c/(2f0√εeff)−2ΔL，fake 谐振为精确逆），elem_w_mm=单元宽 W（沿 x；c/(2f0)√(2/(εr+1))），elem_feed_mm=插入馈深度（缺口深=探针馈点；Rin(y0)=Rin(0)cos²(πy0/L)，0.3L≈100Ω 口径），feed_w_mm=缺口内馈段/探针邻域线宽（HJ 50Ω 1.112mm），spacing_x_mm/spacing_y_mm=元列/元排中心距（均 0.484λ0=25.0172mm，同 C2 扰动域预核）
mesh_note: 辐射器件：上方/侧向空气隙 λ0/4；全部盒缘（贴片/缺口/探针）精确入网（#198）
smoke_note: 未真机冒烟（2026-09-24 注册，离线审计已过）。真机 J4 门预声明于 runs/df6_dp4p3/criteria.md（4 轮装配 σmax≤1.005 硬门 + 全阵 vs 快档带内报告 + Γ_act(0°) vs HFSS Floquet）；发射命令/预算/判读见 runs/df6_dp4p3/handoff.md；openEMS 串行 solo（#246/#261），发射前 CSXCAD 离线 exec 实测 dt/NrTS 预算（#328/#349）
