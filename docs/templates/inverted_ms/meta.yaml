topology: '倒置微带均匀段（TA-7）：金属/介质 z 序相对微带对调——地面=z=0 域 PEC
  底界，零厚条带悬于 z=h_air 空气隙顶（基板下表面），基板 [h_air, h_air+h_sub]
  上覆、其上开放（top MUR）；双 MSLPort 板边入（端口面贴 PML）'
param_semantics: 'w_mm=条带宽（设计链 core/inverted_ms.inverted_ms_design_params：50Ω
  FD 裁判反演，名义 2.1359mm@h_air=h_sub=0.508/εr=3.66）、h_air_mm=地面→条带空气隙（倒置
  微带定义参数，效应=空气填充率高→εeff 低于同叠层微带）、line_len_mm=两端口间线长；
  h_sub/er/tan_d 走 substrate/nominal'
mesh_note: 'mesh_resolution_mm=网格 base 覆盖（mm）；0=自动 λ_sub/50；条带缘 x 向
  + 线两端 y 向精确入网（#198）；z 网格=空气隙 2 层+基板 _sub_cells 层+AIR_TOP（条带
  z 面恰在网格线，#212 审计①）'
smoke_note: 离线审计先行（#212，test_ta_wave_a_templates）；近似级别如实登记：准静态/零厚带/PEC
