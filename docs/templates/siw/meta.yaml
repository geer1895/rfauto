f0_ghz: 10.0
n_ports: 2
template: siw
substrate:
  er: 3.66
  h_mm: 0.508
  tan_d: 0.0037
params:
- w_mm
- d_mm
- s_mm
- line_len_mm
nominal_params:
  w_mm: 12.1317
  d_mm: 0.6
  s_mm: 1.0
  line_len_mm: 63.0724
  h_mm: 0.508
  er: 3.66
  tan_d: 0.0037
max_time_ns: 45.0
mesh_resolution_mm: 0.0
n_segments: null
extraction: >-
  LumpedPort z 桥×2（R=闭式 Z_PV=2b·Z_TE/w_eff，CalcPort 同参考）：
  原始 S=带载比值（#250 口径，slotline_lumped 同）；β/εeff 主判=S21 解缠
  相位斜率÷port_beta.csv 实测 plane_dist（cps 同契约，LumpedPort 无 β
  属性）；fc10 由带内 φ(f)=−β(f；fc)·L+φ0 单参数拟合（OE 锚 G1，预声明
  runs/siw_family/criteria.md §6）
topology: >-
  直 SIW 传输线段：基板 z∈[0,h] 上下显式零厚金属板（贴 z 边界 PEC）+ 两列
  金属化过孔 PEC 圆柱（x=±w/2、心距 s、全域精确栅格、藩篱直入 PML=匹配
  端接）；端口=两端 LumpedPort z 桥（中线、跨全高、盒边入网、16·BASE 出
  PML_8）；域 x 半宽=w/2+w_eff/2（侧界 MUR 吸收泄漏）、y 半宽=line_len/2+
  16·BASE（PML_8）——矩形域，BOARD=60e-3 不适用（机制层 DOM_X/DOM_Y
  字面注入）
param_semantics: >-
  w_mm=两过孔列心距（物理宽度，Cassivi 等效宽度 w_eff=w−d²/(0.95s) 的输入）、
  d_mm=过孔直径、s_mm=过孔心距（渲染按全域 k·s 精确栅格）、line_len_mm=
  两端口测量面间距（名义 3λg@f0 闭式精算）；h/er/tan_d 走 substrate/nominal
  （TE10 截止与 β 与 h 无关，Microwaves101 SIW 条目）
mesh_note: >-
  mesh_resolution_mm=网格 base 覆盖；0=自动 λ_sub/50@F_MAX；全域 NEAR=base/4
  （SmoothMesh 全轴均匀化实测）；过孔直径 ≥4·NEAR 守卫、孔间缝 ≥1 内部线
  （#311 类比）、显式近场线 10µm 地板（#349）、端口盒 ≥2 格且中线落格
  （#283，生成期断言）、基板 z 4 层（TE10 的 E_z 沿 z 均匀，z 分辨非限制项）
smoke_note: >-
  离线审计先行（#212，test_siw_template）；真机锚已落判（df4f：G1 勘误
  PASS/G2 PASS/G3 口径裁定/G4 PASS，runs/siw_family/，驱动
  scripts/siw_anchor_smoke.py）；预声明门与预算见
  runs/siw_family/criteria.md §6
nominal_derivation: |-
  全闭式精算（#1c，criteria.md §2）：fc10 目标=f0/1.5=6.6667GHz（f0=10GHz
  预声明设计点）→ w_eff=c/(2·fc·√3.66)=11.7528 → w=w_eff+d²/(0.95·s)=12.1317
  （Cassivi 2002 反解）；line_len=round(3λg@10GHz,4)=63.0724
  （β=298.856 rad/m 闭式、λg=21.0241，与 synthesize_siw_model 逐位同源）；R_port=Z_PV=2b·Z_TE/w_eff=22.8393Ω（渲染层精算，非手数）；
  设计规则复核：s/d=1.667≤2、d=0.6<λ_sub/5=3.134
