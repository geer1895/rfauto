f0_ghz: 2.5
n_ports: 2
extraction: S11/S21 @ MSLPort 1-2（变容管调谐 BPF：三档偏压=三次静态 run 各自谷位；裁判=hairpin 耦合矩阵理想频响平移到 f0(C(V))，主谐振方程 tan(βL)=−ωCZ0 同源闭式 core/varactor.py）
max_time_ns: 30.0
mesh_resolution_mm: 0.0
n_segments: null
params:
- order
- w_mm
- arm_len_mm
- arm_gap_mm
- gap_mm
- tap_frac
- cj0_pf
- phi_v
- bias_v
template: varactor_bpf
substrate:
  er: 3.66
  h_mm: 0.508
nominal_params:
  order: 3
  w_mm: 1.1117
  arm_len_mm: 31.6675
  arm_gap_mm: 3.0
  gap_mm: 1.1328
  tap_frac: 0.330119
  cj0_pf: 1.0
  phi_v: 0.9
  bias_v: 3.6342
topology: 变容管调谐发夹线带通（M-5 首个半有源模板，hairpin 族增量）：N 个 λg/2 级 U 形谐振器沿 x 并排、相邻外臂平行耦合（缝 gap_mm），每 U 左臂开路端对地并联一只 lumped C(V)（CSXCAD LumpedElement，ny=2 全隙盒）；输入/输出 50Ω 抽头馈线（T 形，板边 x=∓BOARD；单轴 x PML）
param_semantics: order=谐振器阶数 N（每腔一只变容管），w_mm=谐振器/馈线宽（50Ω，skrf HJ 综合），arm_len_mm=装载臂展开中心线总长（无载谐振 f_unloaded 的 λg/2；C 装载使工作点下移——主谐振方程 tan(βL)=−ωCZ0，core/varactor.py 单源），arm_gap_mm=U 内两臂缝（家族名义 3.0），gap_mm=相邻谐振器耦合缝（fake/openEMS 同语义；纯 KJ 口径，结构修正预声明不转移），tap_frac=输入抽头位置比例（loaded 廓线闭式 τ，自 C 端计 branch B——C 端与电压节点之间，τ_node=1−π/(2βL)；#154 收口：与 hairpin 无载族「自开路端计」同名不同义；输出抽头在无 C 臂、自真开路端锚定，两锚不等价=P1 交决策暂同 τ 值），cj0_pf/phi_v=变容管突变结零偏电容（pF）/内建电位（V，选型常数），bias_v=本次 run 的反偏电压（V）——cj0/φ/bias 三键只进 C 字面量不进导体几何（LUMPED_VALUE_PARAMS 口径）
static_c_note: 静态电容口径：FDTD 无时变 C——三档偏压=三次静态 run，各档 C(V)=Cj0/√(1+V/φ) 在该档 bias_v 处为常数，调谐曲线由多点静态解组成（CSXCAD LumpedElement .pyx 口径核实）；C 字面量=C(V)−C_geo（2026-09-29 P2：盒几何寄生平行板项 ε0·εr·WF²/H_SUB=0.0788pF 单源 core/varactor.varactor_box_geo_capacitance_pf——引擎盒区背景位移电流与 lumped 并联，不扣则实感 C=C(V)+C_geo 频偏 #252 族；边缘项欠估 ≤31% 如实预声明，见该函数 docstring）
mesh_note: mesh_resolution_mm=网格 base 覆盖（mm）；0=自动 λ_sub/50；全部臂缘/弯带缘/抽头缘+变容管盒外 y 缘精确入网（#198）
smoke_note: 真机三档偏压冒烟（V=0.5/3.6342/10.0，各档 C 为常数）未发射——本件只备妥发射面与离线审计（M-5 判据「openEMS 名义点 3 档偏压冒烟」归真机批）；离线几何审计（#212 制度化）见 tests/unit/test_varactor_bpf_template.py。2026-09-29 更新：三档冒烟已跑全 FAIL（触帽+慢振铃），规则 1b 模型审计定案 P0=抽头 τ 沿用无载廓线闭式（loaded 节点恰扫过旧设计值 0.401892）外耦失配 3-1139×——本批 P0（loaded 廓线 τ 自 C 端计，名义 0.330119）+P2（C_literal=C(V)−C_geo）修复后真机复验待 oe-queue 排期，详见 runs/varactor_smoke/model_audit_verdict.md

teaching:
  schema: rfauto-teaching/v1
  physics:
    summary: 变容管调谐发夹带通：每腔开路端并联 C(V) 反偏变容管，主谐振方程 tan(βL)=−ωC·Z0 使带心随偏压连续下移——这是 hairpin 家族首个电调谐变体。典型用于可调谐前端选频；常见误用=沿用无载族的抽头位置闭式——装载后电压节点位置改变，抽头必须按
      loaded 廓线自 C 端计（本仓真机三档冒烟全 FAIL 的 P0 根因）。
    derivations:
    - claim: C 装载谐振条件（工作点自无载 f 下移）
      formula: tan(β*L) = -ω*C(V)*Z0
      source: 本仓 core/varactor（装载谐振单源；docs/templates/varactor_bpf/meta.yaml param_semantics）
    - claim: 突变结 C-V 律与装载臂电长联立定工作点
      formula: C(V) = cj0 / (1 + V/phi_v)**m ; tan(β*L) = -ω*C*Z0
      source: 本仓 core/varactor（突变结律；docs/templates/varactor_bpf/meta.yaml param_semantics（cj0/phi/bias
        只进 C 字面量不进导体几何））
  sensitivity_ranking:
  - param: arm_len_mm
    order: 1
    basis: 无载 λg/2 主干（装载使工作点下移，臂长仍是第一几何维）
  - param: cj0_pf
    order: 2
    basis: 变容零偏电容=C(V) 通道主项（调谐范围左端）
  - param: bias_v
    order: 3
    basis: 反偏工作点=C(V) 通道当前值（本次 run 的调谐旋钮）
  - param: gap_mm
    order: 4
    basis: 耦合缝 k(gap)（带宽/回损主维，纯 KJ 口径）
  - param: tap_frac
    order: 5
    basis: 外部 Q 抽头——loaded 廓线自 C 端计（P0 修复语义，与无载族同名不同义）
  - param: phi_v
    order: 6
    basis: 内建电位（C-V 律形状参数，选型常数弱敏感）
  - param: order
    order: 7
    basis: 阶数=离散综合参数（每腔一只变容管）
  quiz_refs: []
