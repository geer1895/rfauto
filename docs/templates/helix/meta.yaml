template: helix
substrate:
  er: 3.66
  h_mm: 0.508
nominal_params:
  helix_d_mm: 3.0
  helix_turns: 2
  helix_pitch_mm: 9.2587
  helix_w_mm: 0.6
  feed_gap_mm: 2.0
topology: 螺旋（§10.3 C1）：单导线 staircase 方螺旋（每圈 4 直段各 1/4 螺距上升 + 角部竖板，无双并联回路），首圈 A 段即馈口顶，总线长 4·d·N + N·p = k_helix·λ0/4（k_helix=1.3615 HFSS 仲裁）；馈口=地面 z=0 → 角 A 柱底 LumpedPort；无介质板（PEC 地面悬空导体）
param_semantics: helix_d_mm=方截面中心线边 d，helix_turns=圈数 N（整数，int() 截断），helix_pitch_mm=螺距 p（=(k_helix·λ0/4−4dN)/N 反解，守卫 ≥1mm），helix_w_mm=导带宽，feed_gap_mm=馈口高
smoke_note: 真机 内部证据档（2026-09-14）FAIL：S11 ≤−1.22dB；Zin 全带容性 X∈[−156,−44]Ω 且随 f 单调升 → 谐振在 2.9GHz 之上（与段首"慢波使谐振更低"预期相反，λ0/4 总线长口径高估电长度）；R=1.8~6.2Ω 与电小天线 395(h/λ)²≈2Ω 一致——即便谐振也对 50Ω 失配，S11 谷深判据不适用，应改判电抗过零。扩带（2026-09-16，内部证据档，1.5-4.5GHz，solve 173s）FOUND：f_x=3.3146GHz R=9.47Ω（首个容性→感性上穿）。**HFSS 同几何仲裁（2026-09-17 收尾批，scripts/hfss_helix_arbitration.py，内部证据档）AGREE**：真实三维盒几何（t*_d 段为 0.6×3.0×0.9 金属块，前六轮 sheet 映射把它压成薄板断了 C→D→A 电流路径 → 全带容性 UNDECIDABLE，几何修复后）f_x_hfss=3.2675GHz R=8.74Ω vs openEMS 3.3146（自动/0.35mm 网格、16.7/50mm 域三重稳健 3.29–3.32）偏差 1.44% ≤5% ⇒ k_helix=f_x(HFSS)/2.4=1.3615 进设计式（K_HELIX 单源），helix_pitch_mm 3.6142→9.2587（element_top 9.23→20.52mm）；新名义真机验证 内部证据档（openEMS 1.9–2.9GHz）FOUND f_x=2.2039GHz R=17.51Ω、S11 min −6.74dB@2.275——落 f0±12% 窗内但偏低 −8.2%：单点 k 修正隐含 f∝1/wire，螺距 3.6→9.3mm 改变慢波因子致一阶外推过冲；割线二次迭代（两点 (31.23mm,3.3146)/(42.52mm,2.2039) → wire≈40.5mm、k≈1.30、pitch≈8.26）须再经 HFSS 仲裁方可进设计式（#190，followUp）。

teaching:
  schema: rfauto-teaching/v1
  physics:
    summary: 法向模方螺旋（单导线 staircase，悬空于 PEC 地上，无介质板）=慢波化谐振
      细天线：总导线长 L_wire=4·d·N+N·p，缠绕引入匝间互耦使有效电长度>几何长度；
      仓内 HFSS 同几何仲裁单源 k_helix=1.3615（L_wire=k_helix·λ0/4，f_x 偏差 1.44%
      AGREE）。电小辐射电阻（∝(h/λ)²，实测 R≈2Ω 量级一致）→ 即便谐振也对 50Ω 强
      失配 → 判据用 Zin 电抗容→感上穿，S11 谷深不适用。
    derivations:
    - claim: 谐振设计式：L_wire = 4·d·N + N·p = k_helix·λ0/4；pitch 反解 p=(k_helix·λ0/4−4·d·N)/N（守卫 ≥1mm）；k_helix 为 HFSS 仲裁单源（真实三维盒几何修复后 AGREE 1.44%，sheet 压薄断电流路径四轮 UNDECIDABLE 教训在档）
      formula: L_wire = 4·d·N + N·p；p = (k_helix·c/(4·f0) − 4·d·N)/N
      source: docs/templates/helix/meta.yaml（topology/param_semantics/smoke_note——K_HELIX 单源与 内部证据档 仲裁链）+ Balanis, Antenna Theory (3rd ed.), Ch.10（螺旋天线：法向模/轴模两域口径）
    - claim: 电小失配与外推纪律：h≪λ 竖直短辐射体的辐射电阻 ∝ (h/λ)²（R≈2Ω 量级与实测一致）→ 谐振判据必须改电抗过零；单点 k 修正隐含 f∝1/wire，pitch 大改时一阶外推过冲（实测偏低 −8.2%）→ 割线二次迭代须经 HFSS 再仲裁方可进设计式（#190）
      formula: R_rad ∝ 40π²·(h/λ)²；f_x ∝ 1/L_wire（一阶隐含，外推过冲实录在档）
      source: docs/templates/helix/meta.yaml（smoke_note——真机链 R 一致性、f_x 偏差、割线迭代 followUp 全账）
  sensitivity_ranking:
  - param: helix_pitch_mm
    order: 1
    basis: pitch 反解吸收全部电长度修正（k_helix 一阶外推过冲实录的主旋钮）
  - param: helix_turns
    order: 2
    basis: 总线长 L_wire=4dN+Np 的整数臂（圈数）
  - param: helix_d_mm
    order: 3
    basis: 单圈周长贡献 4d（与 N 相乘进入 L_wire）
  - param: feed_gap_mm
    order: 4
    basis: 馈口激励向跨度（弱敏感）
  - param: helix_w_mm
    order: 5
    basis: 导带宽 → 端效应/互耦面（细带一阶弱）
  quiz_refs: []
