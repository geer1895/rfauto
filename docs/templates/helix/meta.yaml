f0_ghz: 2.4
n_ports: 1
extraction: S11 @ LumpedPort 1（法向模方螺旋：判据=Zin 电抗容→感上穿 f_x，R 电小失配谷深不适用；旧 λ0/4 口径真机 f_x 3.31GHz，HFSS 同几何仲裁 3.2675GHz 偏差 1.44% AGREE → k_helix=1.3615 定版，见 smoke_note）
max_time_ns: 30.0
mesh_resolution_mm: 0.0
n_segments: null
