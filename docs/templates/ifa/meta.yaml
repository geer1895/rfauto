f0_ghz: 2.4
n_ports: 1
extraction: S11 @ LumpedPort 1（IFA λ/4 窄臂：谷位/谷深；真机 −8.48dB@2.44GHz（+1.7%）PASS，并联型谐振 R_peak≈103Ω 限谷深）
max_time_ns: 30.0
