f0_ghz: 2.5
n_ports: 2
extraction: S11/S21 @ MSLPort 1-2（交叉耦合开路环 BPF：带内回波纹波+带外抑制+
  **有限传输零点**（TZ，交叉耦合指纹）；裁判=C13 耦合矩阵闭式
  coupling_matrix_response（cm_core 折叠矩阵消费），缝→k 纯 KJ+χ 一阶部分长标度）
max_time_ns: 30.0
mesh_resolution_mm: 0.0
n_segments: null
params:
- w_mm
- a_mm
- g12_mm
- g23_mm
- g34_mm
- g14_mm
- g_open_mm
- g_pos_mm
- tap_t_mm
template: xcheb_bpf4
substrate:
  er: 3.66
  h_mm: 0.508
nominal_params:
  w_mm: 1.1117
  a_mm: 8.7626
  g12_mm: 0.3581
  g23_mm: 0.4253
  g34_mm: 0.2885
  g14_mm: 1.6526
  g_open_mm: 0.3
  g_pos_mm: 6.1338
  tap_t_mm: 8.1454
  h_mm: 0.508
  er: 3.66
  tan_d: 0.0037
topology: '交叉耦合开路环四重奏（TA-14）：四个 λg/2 方形开路环 2×2 排布（环1
  左上/2 右上/3 右下/4 左下）；耦合=1-2 顶行水平缝 + 2-3 右侧竖缝 + 3-4 底行
  水平缝 + **4-1 左侧竖缝（非相邻交叉耦合，cm_core folded m14 映射）**；馈电
  =环 1/4 左边抽头（50Ω 馈线自 x=−BOARD 板边，hairpin A1 去嵌口径）'
param_semantics: 'w_mm=环线宽（50Ω HJ 单源）、a_mm=环边段长（周长=4a=λg/2−2Δl）、
  g12/g23/g34_mm=主线耦合缝（1-2/2-3/3-4，KJ 反解 k/χ）、g14_mm=**交叉耦合缝**
  （4-1，非相邻矩阵条目 m14 映射——本模板的存在理由）、g_open_mm=环开缝宽（开路
  端）、g_pos_mm=环 1/4 开缝中心自自由边角偏置（Q_e 路径的一部分）、tap_t_mm=抽头
  自角距离（Q_e 闭式 τ·周长−g_pos）；er/tan_d 走 substrate/nominal'
mesh_note: 'mesh_resolution_mm=网格 base 覆盖（mm）；0=自动 λ_sub/50；#266 耦合缝
  守卫 NEAR≤缝_min/3（layout 抛错拒渲染）；全部环边/开缝缘/馈线缘精确入网（#198）
  +四耦合缝中线入网（#311）；审计档 TEMPLATE_MESH_MM=0.35（NEAR=0.0875 ≤ 0.2885/3
  过守卫）'
smoke_note: 离线审计先行（#212，test_ta_wave_c_templates）；内核数字裁判三锚
  （test_cross_coupled_map）：①全极点退化对 classical g 值闭式（独立综合路径，
  max rel dev 1.2e-5）②KJ 往返+矩阵频响一致性（max|ΔS|≤1e-6 实测 7.5e-7）③
  TZ=[±2.0] 传输零点保持（−88dB 谷映射前后一致）；χ 一阶部分长耦合与环角/开缝
  结构效应未经 EM 校准（hairpin c(gap) 同族待标定项，#122 如实登记）；真机冒烟
  与 HFSS 仲裁属后续批次（本批零发射）

teaching:
  schema: rfauto-teaching/v1
  physics:
    summary: 交叉耦合四重奏 BPF：四个 λg/2 开路环 2×2 排布，第 4 条非相邻耦合缝（4-1）注入 m14 交叉耦合，在带外造出传输零点（TZ）——这是相对全极点 Chebyshev
      的选择性增益来源。典型用于需要陡峭带缘的窄带滤波；常见误用=只看带内回损不看 TZ 位置——交叉耦合强度（g14 缝）同时改 TZ 频率与带内纹波相位。
    derivations:
    - claim: 非相邻耦合条目 m14 的 folded 矩阵映射（TZ 产生机制）
      formula: M_folded[1,4] != 0 → TZ 对（本仓名义 TZ=±2.0 保持 −88dB 谷）
      source: 本仓 core/cross_coupled_map（folded 映射与频响内核；docs/templates/xcheb_bpf4/meta.yaml param_semantics（三锚：全极点退化
        1.2e-5/KJ 往返 7.5e-7/TZ 保持））
    - claim: 环周长=λg/2（开路环谐振，4a 周长口径）
      formula: 4*a = λg/2 - 2*Δl
      source: 本仓 core/cross_coupled_map（耦合矩阵族内核；docs/templates/xcheb_bpf4/meta.yaml param_semantics（a_mm=环边段长口径））
  sensitivity_ranking:
  - param: a_mm
    order: 1
    basis: 环边段长（4a=λg/2 谐振恒等式主控）
  - param: g14_mm
    order: 2
    basis: 交叉耦合缝（TZ 位置/深度主维——本模板的存在理由）
  - param: g12_mm
    order: 3
    basis: 主线耦合缝（带宽/回损主维）
  - param: g23_mm
    order: 4
    basis: 中线耦合缝（k 矩阵中列）
  - param: g34_mm
    order: 5
    basis: 底行耦合缝
  - param: tap_t_mm
    order: 6
    basis: 抽头位置（外部 Q 路径的一部分，与 g_pos 联立）
  - param: g_open_mm
    order: 7
    basis: 环开缝宽（开路端与 Q_e 路径弱维）
  - param: g_pos_mm
    order: 8
    basis: 开缝中心偏置（Q_e 路径的一部分）
  - param: w_mm
    order: 9
    basis: 环线宽（50Ω 口径，经 εeff 弱进入谐振）
  - param: er
    order: 10
    basis: εeff 填充加权（|∂lnf0/∂lnεeff|≤1/2 恒等式族）
  quiz_refs: []
