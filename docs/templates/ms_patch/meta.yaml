f0_ghz: 10.0
n_ports: 1
template: ms_patch
substrate:
  er: 3.66
  h_mm: 1.524
  tan_d: 0.0037
params:
- px_mm
- py_mm
- period_mm
- h_mm
nominal_params:
  px_mm: 8.5406
  py_mm: 8.5406
  period_mm: 14.9896
  h_mm: 1.524
  er: 3.66
  tan_d: 0.0037
max_time_ns: 30.0
mesh_resolution_mm: 0.0
n_segments: null
extraction: >-
  S11 @ 双 E 探针对反射分解（soft plane 激励 exc_type=0；探针对=贴片上方空气区
  2 只全口径 E 线探针，对内距 λ0/16，精确 β=2πf/c 分解 F/B 后 _WgProbePairRefl
  对调 uf——入射=−z 照明波、反射=+z 回波，footer 契约/S 列 schema 不变，
  _port2=_port1 别名 S21 列≡S11）。波导模拟器≡无限阵@θ=0，E∥x 极化前提；
  |S11|≈1 的 argΓ 逐 px 入反射相位 LUT（探针面去嵌相位常数项不进扫 px 差分）；
  健康判据=|Γ| 线性域 ≈1（空波导标定 EN=|Γ|²≈1.0 平坦）。无耗接地结构幅度
  读出 «1 = 读出判废信号。（2026-10-01 扩展批 ms_patch 读出修复：原全口径
  LumpedPort 电阻片=测量面并联 Z0 负载，反射相位为片负载 Möbius 像，
  内部证据档 §D/E）
topology: >-
  反射阵方贴片单元：接地基板（z 底 PEC 边界）+ 零厚方贴片；单胞方形域
  x 对壁 PEC / y 对壁 PMC（TEM 平面波，官方 Parallel Plate Waveguide 教程
  口径）；贴片上方 λ0/4 空气区置双 E 探针对（自由悬浮无源）+ 探针对上方
  soft plane 激励面，域内零电阻片
param_semantics: >-
  px_mm=E 向（x）谐振边长（LUT 扫描变量），py_mm=非谐振宽（y），
  period_mm=单胞周期（方形域边长），h_mm=基板厚；er/tan_d 走
  substrate/nominal（材料属性不改导体）
mesh_note: >-
  mesh_resolution_mm=网格 base 覆盖；0=自动 λ_sub/50@F_MAX；贴片缘精确入网
  +胞缘缝 3+ 中点入网（#311）；NEAR≤最小胞缘缝/3 渲染期守卫（#266）；
  全轴最小网格间距 ≥10µm
smoke_note: >-
  离线审计先行（#212，test_metasurface_templates）；波导模拟器扫描战役
  （粗 21+细 41 点）发射面见 内部证据档；读出修复后重扫
  见 内部证据档（J2 fallback 战役段②）；J1c 相位覆盖 ≥300° 与
  J4 HFSS Floquet 锚属真机轨
nominal_derivation: |-
  全闭式精算（#1c/#252，core/metasurface_lut 单源，criteria.md §1d）：
  period=λ0/2=14.9896（0.5λ0 口径，λ0=c/f0=29.9792458mm）；px=py=方贴片谐振边长
  λ0/(2√εeff(w)) 不动点（Hammerstad εeff，w=边长自洽迭代），
  er=3.66/h=1.524 → px=8.5406；h=1.524（60mil 板材数据，X 波段反射阵
  常用厚度→单贴片相位覆盖宽，J1c fallback=双谐振预登记）

teaching:
  schema: rfauto-teaching/v1
  physics:
    summary: 超表面方贴片单元：贴片边长=介质上 λg/2 谐振（λ0/(2√εeff) 自洽不动点），阵格取 λ0/2 抑制光栅瓣——单元尺寸是反射相位的主要旋钮。典型用于反射阵/超表面口径设计；常见误用=按普通贴片天线口径算单元——单元无馈、靠散射相位工作，尺寸扫描才是相位覆盖设计（60mil
      厚板单贴片相位覆盖宽）。
    derivations:
    - claim: 方贴片谐振边长不动点（Hammerstad εeff，w=边长自洽迭代）
      formula: px = c/(2*f0*sqrt(εeff(px)))
      source: 本仓 core/metasurface_lut（ms_patch_resonant_len_mm 不动点单源；docs/templates/ms_patch/meta.yaml
        nominal_derivation（er=3.66/h=1.524 → px=8.5406mm））
    - claim: 阵格 λ0/2 无光栅瓣口径
      formula: period = λ0/2 = 14.9896 mm
      source: 本仓 core/metasurface_lut（阵格口径；docs/templates/ms_patch/meta.yaml nominal_derivation（Balanis,
        Antenna Theory (3rd ed.) Ch.6 阵列栅瓣判据同族））
  sensitivity_ranking:
  - param: px_mm
    order: 1
    basis: 单元谐振主维（εeff(px) 通道使弹性>1）；登记表 1.0424
  - param: er
    order: 2
    basis: 填充加权（贴片谐振通道）；登记表 0.4629
  - param: h_mm
    order: 3
    basis: 板厚经 εeff 弱进入；登记表 0.0424
  - param: py_mm
    order: 4
    basis: 正交轴对称（方贴片与 px 等效，登记表 0——目标式只消费 px）
  - param: period_mm
    order: 5
    basis: 阵格不进单元谐振式（登记表 0——光栅瓣维）
  - param: tan_d
    order: 6
    basis: 损耗角不进谐振式（登记表 0）
  quiz_refs: []
