topology: 交指带通（§C3 滤波器族 II，Cohn 交指口径）：N 根 λ/4 均匀谐振棒平行排列，接地端交替（奇棒底端过孔/偶棒顶端过孔，r=0.15mm），相邻棒全长缝耦合；双 50Ω 馈线缝耦合自 y=−BOARD 板边引入（gysel 同边先例，单轴 PML）
param_semantics: order=谐振棒数 N（决定 gaps_mm 列表长度 N+1，单独改 order 而不改列表=非法，_c3_layout 显式报错）；w_mm=棒/馈线宽（50Ω，skrf HJ 综合 live 值 1.1117）；res_len_mm=棒物理长（λ/4(εeff=2.8578)=17.7338 − 过孔缩短 0.4431 − 开路端 Δl=0.2086，电路裁判以等效长度回代；登记⑨ 校准口径 tanθ_c=Z_r/(ω0L_via)，L_via=0.125nH HFSS 仲裁校准值（原 Goldfarb-Pucel 0.29596nH 高估已弃），缺省渲染几何在过孔存在下谐振回 f0）；gaps_mm[j]=第 j 缝边到边（j=0 馈-棒1 … j=N 棒N-馈；fake/openEMS 两通道同索引同语义，#154）；feed_len_mm=板边到棒阵列底端的馈线段长（阵列 y 居中 ⇒ 两馈等长）
design_note: C13 folded N=3/RL20dB/δ5% → Q_e=17.0689、k=0.051514；MYJ 斜率 b=π/(4Z_r)=0.015708 S（λ/4 短路棒）→ J=[4.290e-3, 8.09e-4, 8.09e-4, 4.290e-3] S → Cohn 精确 x=[0.22603, 0.04053, 0.04053, 0.22603] → KJ 1984 一维反解缝；登记⑨ 过孔补偿（设计链 l_via_h=None）：tanθ_c=Z_r/(ω0L) → θ_c=1.53155 rad，棒电长缩短 0.4431mm，Y(f0) 过孔端接自证 |Y|=2.12e-18 S，斜率 b 经由孔二阶（数值 −0.034%）；邻耦合近似（非邻耦合/棒端寄生由 EM 冒烟实测）
smoke_note: 真机 openEMS 冒烟后置（循 coupled_bpf NrTS PARTIAL 先例；真机冒烟并入后续批量计划），本项全程离线验收
