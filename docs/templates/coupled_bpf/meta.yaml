f0_ghz: 2.5
n_ports: 2
extraction: S11/S21 @ MSLPort 1-2（平行耦合 BPF：带内回波纹波 + 带外抑制；裁判=电路级联 coupled_bpf_circuit_sparams，同步 TEM 极限对照 C13 coupling_matrix_response 互证）
max_time_ns: 30.0
mesh_resolution_mm: 0.0
n_segments: null
