f0_ghz: 2.4
n_ports: 2
extraction: S11/S21 @ MSLPort 1-2（地面谐振缝：S21 辐射凹位置+深度=谐振判据，过缝辐射负载使 S11 全带平坦不适用；真机 −16.41dB@2.665GHz PASS；判读窗收内带 f0±0.4GHz + Σ|S|²>1.02 点剔除——带边 Σ|S|²>1 为高斯激励 −20dB 带边归一化伪象，见 smoke_note）
max_time_ns: 30.0
mesh_resolution_mm: 0.0
n_segments: null
params:
- slot_l_mm
- slot_w_mm
- feed_w_mm
- feed_margin_mm
template: slot
substrate:
  er: 3.66
  h_mm: 0.508
nominal_params:
  slot_l_mm: 40.9168
  slot_w_mm: 2.0
  feed_w_mm: 1.1134
  feed_margin_mm: 12.0
topology: 缝隙（§10.3 C1）：z=0 有限金属地（4 盒拼合、槽 L×Ws 留空）+ z=h 50Ω 微带馈线 y 向垂直跨槽居中 + 双 MSLPort 板边端接（y=∓BOARD，单轴 PML）；底 MUR + z 向下延 λ0/4（槽向下半空间也辐射，PEC 底会短路槽）
param_semantics: slot_l_mm=缝长（λ0/(2√((1+εr)/2))，Booker 对偶+半空间均值口径），slot_w_mm=缝宽，feed_w_mm=馈线宽（50Ω HJ），feed_margin_mm=板边到馈线手画段起点的馈段长（MSLPort 自画，MeasPlaneShift=margin/3）
smoke_note: 真机 runs/antenna2_smoke/slot 与 slot_override（2026-09-14）PASS×2：S21 辐射凹 −16.41dB @2.665GHz（L=40.9168，+11.0%，隐含 εeff 1.84）/ −21.76dB @2.6275GHz（L=46.036，隐含 εeff 1.54）；k_slot∈[0.66,0.79]·(1+εr)/2 待 HFSS 仲裁后才进设计式（#190）。Σ|S|² 带边 >1 已排查（2026-09-16，slot/sparams.csv 实测）：1.9GHz=1.212、2.9GHz=1.128，>1.02 的点全部落在 1.9-2.08 与 2.82-2.9 两侧，f0±12% 判读窗（2.112-2.688GHz）内 ≤1.008——越限恰在 SetGaussExcite(F0,FC) 高斯激励 −20dB 带边（评估带=激励带，uf_inc 归一化分母趋零放大数值噪声），归一化伪象而非 MSLPort/有限地物理错；判读口径=窗收内带 f0±0.4GHz（激励带内 80%）+ Σ|S|²>1.02 点剔除（scripts/smoke_antenna2_anchor.py 全模板通用；掩模后 307/321 点，凹位/深度不变），全局 FC 不动（f_max 进网格预算，改激励带会漂全部模板网格锚）

teaching:
  schema: rfauto-teaching/v1
  physics:
    summary: 有限金属地上的半波谐振缝（微带馈线垂直跨缝居中）：Babinet/Booker 互补
      对偶——PEC 上的缝 ≡ 互补偶极子（辐射图 E/H 面互换、馈阻抗对偶）；薄槽低 εr
      基板的设计 εeff≈(1+εr)/2（上/下半空间均值口径）→ slot_l=λ0/(2√εeff)。谐振时
      过缝辐射负载使 S21 出现凹谷（凹位+凹深=谐振判据，S11 全带平坦不适用）。真机
      实测谷位隐含 εeff 低于薄槽极限（k_slot∈[0.66,0.79]·(1+εr)/2，HFSS 仲裁未定前
      设计式维持名义口径，如实注记）。
    derivations:
    - claim: 半波槽谐振设计式：slot_l = λg/2 = λ0/(2√εeff)，薄槽 εeff≈(1+εr)/2；名义 40.9168mm@2.4GHz/εr=3.66 即此口径（meta nominal_params，内核/文献链在档）
      formula: slot_l = λ0/(2·√((1+εr)/2))
      source: docs/templates/slot/meta.yaml（param_semantics——Booker 对偶+半空间均值口径；nominal_params）+ core/slotline.py（Janaswamy-Schaubert 槽线闭式模块，薄槽低 εr 段口径）
    - claim: 互补对偶物理与判读口径：Babinet/Booker——缝与互补偶极子在阻抗上对偶（Z_slot·Z_dipole=η0²/4 同 k 恒等式，与仓内 CPS/CPW 对偶同源）；微带跨缝馈=磁耦合，谐振深度受辐射负载与有限地边缘调制；判读窗收 f0±0.4GHz+Σ|S|²>1.02 剔除（带边高斯激励归一化伪象，非物理）
      formula: Z_slot(k)·Z_dipole(k) = η0²/4（Babinet 对偶恒等式）
      source: docs/rf_template_references.md（互补对偶常数核实节）+ docs/templates/slot/meta.yaml（smoke_note——真机判读与 k_slot 仲裁注记）
  sensitivity_ranking:
  - param: slot_l_mm
    order: 1
    basis: λg/2 恒等式 |∂lnf0/∂lnL|=1（缝长=谐振长度主量）
  - param: er
    order: 2
    basis: εeff=(1+εr)/2 直接进入设计式（√ 的一半次方灵敏度）
  - param: slot_w_mm
    order: 3
    basis: 缝宽 → 互补偶极子等效半径/εeff 修正面（有限宽修正）
  - param: feed_w_mm
    order: 4
    basis: 50Ω 馈线跨缝耦合强度（凹深面）
  - param: feed_margin_mm
    order: 5
    basis: 馈段电长度（MeasPlaneShift 口径，弱敏感）
  quiz_refs: []
