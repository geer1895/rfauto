f0_ghz: 5.8
n_ports: 4
extraction: 整 4×4 S @ LumpedPort 1-4（单激励 9 列 CSV，excite_port=1..4 进程隔离轮转装配 → .s4p，#208）+ EEPₙ @ farfield3d_cplx.csv（far_field=True，f_res=F0 固定口径，轮间同频可叠加）；互耦档判据 J4 见 runs/df6_dp4p3/criteria.md
max_time_ns: 30.0
mesh_resolution_mm: 0.0
n_segments: null
params:
- elem_len_mm
- elem_w_mm
- elem_feed_mm
- spacing_x_mm
- feed_w_mm
template: patch_eep_1x4
substrate:
  er: 3.66
  h_mm: 0.508
nominal_params:
  elem_len_mm: 12.9058
  elem_w_mm: 16.9311
  elem_feed_mm: 3.8717
  spacing_x_mm: 25.0172
  feed_w_mm: 1.112
topology: 1×4 EEP 贴片阵（§DP-4 P3）：4 元沿 x 等距 spacing（行中心 y=20mm），缺口全开 −y；每元独立 LumpedPort 底探针（端口 1..4 =x 升序），无 corporate 馈树，元间 DC 隔离=EEP 定义性质；基板 + z-min PEC 地
param_semantics: elem_len_mm=单元谐振长 L（沿 y；Balanis Ch.14 c/(2f0√εeff)−2ΔL，fake 谐振为精确逆），elem_w_mm=单元宽 W（沿 x；c/(2f0)√(2/(εr+1))），elem_feed_mm=插入馈深度（缺口深=探针馈点；Rin(y0)=Rin(0)cos²(πy0/L)，0.3L≈100Ω 口径），feed_w_mm=缺口内馈段/探针邻域线宽（HJ 50Ω 1.112mm），spacing_x_mm=单元中心距 d（0.484λ0=25.0172mm；栅瓣判据 d<λ0，1×4 跨度 3d+W 扰动域与 C2 同款预核 ≤120mm 板）
mesh_note: 辐射器件：上方/侧向空气隙 λ0/4；全部盒缘（贴片/缺口/探针）精确入网（#198）
smoke_note: 未真机冒烟（2026-09-24 注册，离线审计已过）。真机 J4 门预声明于 runs/df6_dp4p3/criteria.md（4 轮装配 σmax≤1.005 硬门 + 全阵 vs 快档带内报告 + Γ_act(0°) vs HFSS Floquet）；发射命令/预算/判读见 runs/df6_dp4p3/handoff.md；openEMS 串行 solo（#246/#261），发射前 CSXCAD 离线 exec 实测 dt/NrTS 预算（#328/#349）
teaching:
  schema: rfauto-teaching/v1
  physics:
    summary: 1×4 边馈贴片阵（每元独立端口、无 corporate 馈树）：单元=Balanis
      传输线/腔模型矩形贴片——宽 W 定阻抗/带宽、谐振长 L+2ΔL=λg/2；插入馈
      深度沿腔内驻波电压分布抽头（Rin(y0)=Rin(0)·cos²(πy0/L)）定馈电阻抗。
      元间距 d 是阵因子/互耦旋钮（d<λ0 无栅瓣判据）；每元独立 LumpedPort 使
      元间耦合 S_n1 直接读出（单激励进程隔离轮转装配 4×4 S 矩阵，#208 口径）
      ——元间 DC 隔离是边馈定义性质，互耦测量是该族设计目的。
    derivations:
    - claim: 单元尺寸设计式：宽 W=c/(2f0)·√(2/(εr+1))（主控阻抗/带宽）；谐振
        长 L+2ΔL=c/(2f0√εeff)（εeff 薄线式+边缘延伸 ΔL）——数值一律内核键
        产出
      formula: W = c/(2·f0)·√(2/(εr+1))；L+2ΔL = c/(2·f0·√εeff)
      source: core/synthesis.py（synthesize_patch/patch_fringing_delta_l）+
        calc_families/rf_match.py（patch_length 键：Balanis 闭式含边缘修正）+
        docs/rf_template_references.md（C2 阵列族节 Ch.14 已核口径）+ Balanis,
        Antenna Theory (4th ed.), Ch.14（微带天线传输线/腔模型）
    - claim: 插入馈抽头与阵维：腔模型沿谐振轴电压驻波 V(y)∝cos(πy/L)，馈点
        y0 抽头使 Rin(y0)=Rin(0)·cos²(πy0/L)（插入深度定匹配口径，meta
        param_semantics 0.3L 档）；元间距 d 进阵因子 AF（d≥λ0 出栅瓣）——
        间距是互耦/口径维而非单元谐振维
      formula: Rin(y0) = Rin(0)·cos²(π·y0/L)；
        阵因子取模 AF = sin(Nψ/2)/(N·sin(ψ/2))，ψ = k·d·cosθ（均匀线阵）
      source: docs/templates/patch_eep_1x4/meta.yaml（param_semantics 抽头/
        间距口径）+ docs/rf_template_references.md（C2 阵列族节 Balanis Ch.6
        ULA AF 闭式已核同式）+ Balanis, Antenna Theory (4th ed.), Ch.6（阵列
        栅瓣判据）
  sensitivity_ranking:
  - param: elem_len_mm
    order: 1
    basis: 单元谐振主维（λ/2 腔恒等 |∂lnf0/∂lnL|≈1，腔模型口径）
  - param: elem_w_mm
    order: 2
    basis: 经 εeff(W)/ΔL 弱进入谐振频率；主控单元阻抗/带宽（Balanis W 式语义）
  - param: elem_feed_mm
    order: 3
    basis: 插入馈抽头定馈电阻抗/匹配（cos² 抽头面），不移动腔谐振频率
  - param: spacing_x_mm
    order: 4
    basis: 阵因子/互耦维（d<λ0 无栅瓣判据；非单元谐振量）
  - param: feed_w_mm
    order: 5
    basis: 缺口内馈段线宽（50Ω 邻域），弱敏感；本族排序为物理定性口径——
      登记表暂无已落档（knowledge/sensitivity_rankings.yaml 未含本族，不硬凑
      数值）
  quiz_refs: []
