f0_ghz: 5.8
n_ports: 1
extraction: S11 @ LumpedPort 1（底探针馈 H-tree 2×2 贴片阵：谷位/谷深；方向图走 far_field=True nf2ff，离线裁判=平面阵可分离积 AF_x·AF_y 逐点；未真机冒烟）
max_time_ns: 30.0
mesh_resolution_mm: 0.0
n_segments: null
params:
- elem_len_mm
- elem_w_mm
- elem_feed_mm
- spacing_x_mm
- spacing_y_mm
- feed_w_mm
- q_w_mm
- q_len_mm
template: patch_array_2x2
substrate:
  er: 3.66
  h_mm: 0.508
nominal_params:
  elem_len_mm: 12.9058
  elem_w_mm: 16.9311
  elem_feed_mm: 3.8717
  spacing_x_mm: 25.0172
  spacing_y_mm: 25.0172
  feed_w_mm: 1.112
  q_w_mm: 0.6025
  q_len_mm: 7.8217
topology: 2×2 平面贴片阵（§10.3 C2）：栅格中心 (0,20mm)，元列 x=±dx/2、元排 y=20∓dy/2；底排缺口向 −y 自下入，顶排缺口向 +y——馈线经 J1± 沿 y0 外走到元列外侧走廊 x=±(dx/2+W/2+2mm) 上行、顶排上方内折、变换段自上向下入缺口（同层零交叉）；H-tree 阻抗账同 1×4；基板 + z-min PEC 地
param_semantics: elem_len_mm=单元谐振长 L（沿 y；Balanis Ch.14 传输线模型 c/(2f0√εeff)−2ΔL，fake 谐振为其精确逆），elem_w_mm=单元宽 W（沿 x；c/(2f0)√(2/(εr+1))，决定 εeff/ΔL 与 H 面波束），spacing_x_mm/spacing_y_mm=元列/元排中心距（均 0.484λ0=25.0172mm；可分离栅格），feed_w_mm=50Ω 线宽（主干/透明连线/缺口内馈段；HJ 1.112mm），q_w_mm=70.7Ω λ/4 变换段宽（HJ 0.6025mm），q_len_mm=变换段长 λ/4=c/(4f0√εeff(q_w))=7.8217mm（J0→J1± 与各元入缺口最后一段共用），elem_feed_mm=插入馈深度 y0（缺口深=馈线终点=馈点；Rin(y0)=Rin(0)cos²(πy0/L)，0.3L≈100Ω 口径）
mesh_note: 辐射器件：上方/侧向空气隙 λ0/4；全部盒缘精确入网（#198）
smoke_note: 未真机冒烟（2026-09-15 注册，离线审计/闭式裁判已过）。openEMS 轨 followUp：scripts/smoke_array_anchor.py <template>，判据=S11 谷位 f0±12% 窗（谷深 ≤−6dB）+ far_field nf2ff 主瓣天顶/HPBW·Dmax 对照 core/array_synthesis 闭式 ≤20-30% + η=Prad/P_acc 合理；预算 NrTS=100000 分钟~小时级，逐模板串行单飞

teaching:
  schema: rfauto-teaching/v1
  physics:
    summary: 2×2 平面贴片阵：可分离栅格使平面阵因子=AF_x·AF_y 积，H-tree 同层零交叉馈电。典型用于双维波束宽度压缩的天顶链路；常见误用=把 H-tree 走线当等长透明线——每级
      λ/4 变换段是阻抗账，长错了就是错匹配不是版图自由。
    derivations:
    - claim: 矩形栅格可分离 AF 积（§6.10）
      formula: AF(θ,φ) = AF_x(sinθcosφ) * AF_y(sinθsinφ)
      source: C.A. Balanis, Antenna Theory (3rd ed.), Ch.6 §6.10；docs/rf_template_references.md §12 已核
    - claim: H-tree 阻抗账（λ/4 70.7Ω 变换树与 1×4 同式）
      formula: q_len = c/(4*f0*sqrt(εeff(q_w))) = 7.8217 mm
      source: 本仓 core/synthesis（inverse_width/forward_z0 HJ 单源；docs/templates/patch_array_2x2/meta.yaml
        param_semantics）
  sensitivity_ranking:
  - param: elem_len_mm
    order: 1
    basis: 单元 λ/2 谐振恒等式（精确）
  - param: spacing_x_mm
    order: 2
    basis: x 向阵因子主维（可分离积的 x 通道）
  - param: spacing_y_mm
    order: 3
    basis: y 向阵因子主维（y 通道）
  - param: q_len_mm
    order: 4
    basis: λ/4 变换段恒等式（H-tree 阻抗账）
  - param: elem_w_mm
    order: 5
    basis: 单元宽（H 面波束+弱进谐振）
  - param: elem_feed_mm
    order: 6
    basis: 插入馈深度（Rin 匹配维）
  - param: q_w_mm
    order: 7
    basis: 70.7Ω 段线宽（阻抗口径）
  - param: feed_w_mm
    order: 8
    basis: 50Ω 馈线宽（匹配弱维）
  quiz_refs: []
