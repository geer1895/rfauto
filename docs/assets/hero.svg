<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'Noto Sans',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="0.55" stop-color="#0F172A"/><stop offset="1" stop-color="#16324F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.16"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#glow)"/>
  <!-- sine wave motif: RF identity -->
  <g stroke="url(#accent)" fill="none" stroke-width="2.5" opacity="0.85">
    <path d="M 640 120 C 670 60, 700 60, 730 120 S 790 180, 820 120 S 880 60, 910 120 S 970 180, 1000 120"/>
  </g>
  <g fill="#38BDF8" opacity="0.9">
    <circle cx="640" cy="120" r="4"/><circle cx="820" cy="120" r="4"/><circle cx="1000" cy="120" r="4"/>
  </g>
  <g stroke="#34D399" fill="none" stroke-width="1.8" opacity="0.55">
    <path d="M 640 120 C 670 175, 700 175, 730 120 S 790 65, 820 120 S 880 175, 910 120 S 970 65, 1000 120" stroke-dasharray="6 5"/>
  </g>

  <text x="56" y="104" fill="#F8FAFC" font-size="56" font-weight="800" letter-spacing="1">rfauto</text>
  <rect x="56" y="122" width="88" height="4" rx="2" fill="url(#accent)"/>
  <text x="56" y="158" fill="#CBD5E1" font-size="19" font-weight="500">RF/microwave design automation with LLM orchestration</text>
  <text x="56" y="184" fill="#7C8DA6" font-size="14.5">HFSS · ADS · openEMS · Palace behind one deterministic interface</text>

  <g font-size="14" font-weight="700">
    <rect x="640"  y="28" width="96"  height="30" rx="15" fill="#1E293B" stroke="#334155"/><text x="688"  y="48" fill="#7DD3FC" text-anchor="middle">71 templates</text>
    <rect x="748"  y="28" width="88"  height="30" rx="15" fill="#1E293B" stroke="#334155"/><text x="792"  y="48" fill="#7DD3FC" text-anchor="middle">254 CLI</text>
    <rect x="848"  y="28" width="128" height="30" rx="15" fill="#1E293B" stroke="#334155"/><text x="912"  y="48" fill="#7DD3FC" text-anchor="middle">149 MCP tools</text>
    <rect x="988"  y="28" width="88"  height="30" rx="15" fill="#1E293B" stroke="#334155"/><text x="1032" y="48" fill="#7DD3FC" text-anchor="middle">60 anchors</text>
    <rect x="1088" y="28" width="100" height="30" rx="15" fill="#1E293B" stroke="#334155"/><text x="1138" y="48" fill="#7DD3FC" text-anchor="middle">16+ engines</text>
  </g>
  <text x="1144" y="222" fill="#475569" font-size="12" text-anchor="end">GPL-3.0 · python 3.10+</text>
</svg>
