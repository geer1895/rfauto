# rfauto 文档站（PR-10，round16 规格；mkdocs-material 路线）
# 本地构建：.venv/Scripts/python.exe -m mkdocs build
# 预览产物：runs/pr10/site_preview/（gitignored，不入库）
# 部署面：GitHub Pages（准备就绪、未执行——workflow 草案与启用步骤见
#   runs/pr10/deploy_preview/；公开仓 push 逐次授权后才接线）

site_name: rfauto
site_description: "rfauto —— HFSS ↔ ADS 自动化仿真调优框架文档站"
site_author: rfauto contributors
# site_url / repo_url 待公开仓库 URL 就绪后补填（不编造 URL——F4 followUp 同纪律）
docs_dir: docs_site
site_dir: runs/pr10/site_preview

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: "切换到暗色主题"
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: "切换到亮色主题"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

