<!DOCTYPE html>
<html lang="zh" data-theme="midnight">
<head>
<meta charset="utf-8">
<title>rfauto 射频调优工作台</title>
<script>
/* 主题防闪（FOUC，guide §13.1 / R1 审计 P0-2）：head 内联、样式表生效前同步
   读档 → html[data-theme]，消灭"存了 light/ocean/system(亮) 的用户刷新先闪
   暗色再跳变"。与 pages.js 同一存储键（rfauto-theme）与同一定型规则：旧值
   "dark" 视为 midnight 别名；未知/缺省=system → 跟随 prefers-color-scheme
   （亮→light，暗→midnight）。失败安全：localStorage 不可用（隐私模式等）
   保持 html 标签缺省 midnight。body.light 信号：早镜像到
   documentElement.light，DOMContentLoaded 时补写 body.light（pages.js
   initPages 随后接管同值双写）。CSP（D-04）：本内联脚本 sha256 已钉进
   server.py:CSP_VALUE——改动本脚本内容必须同步该哈希（test_w1e_ui_csp 与
   test_ui_theme_boot 双门抓失配）。 */
(function () {
  var mode = null;
  try { mode = localStorage.getItem("rfauto-theme"); } catch (e) { /* 隐私模式等 */ }
  if (mode === "dark") mode = "midnight";
  if (mode !== "midnight" && mode !== "ocean" && mode !== "light") {
    var sysLight = false;
    try {
      sysLight = !!(window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: light)").matches);
    } catch (e) { /* 无 matchMedia 环境 */ }
    mode = sysLight ? "light" : "midnight";
  }
  var de = document.documentElement;
  de.dataset.theme = mode;
  de.classList.toggle("light", mode === "light");
  document.addEventListener("DOMContentLoaded", function () {
    document.body.classList.toggle("light", mode === "light");
  });
})();
</script>

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  display: flex; min-height: 100vh;
  transition: background var(--transition-slow) var(--ease-in-out),
              color var(--transition-slow) var(--ease-in-out);
}
::selection { background: var(--primary-glow); color: var(--fg); }

/* ── 极光背景（指南 §8：三层径向渐变 + blur80 + 25s 漂移；GPU 加速）── */
body::before {
  content: ""; position: fixed; inset: -10%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(640px circle at 18% 24%, var(--aurora-1), transparent 70%),
    radial-gradient(820px circle at 82% 72%, var(--aurora-2), transparent 70%),
    radial-gradient(1000px circle at 55% 45%, var(--aurora-3), transparent 72%);
  filter: blur(80px); will-change: transform;
  animation: aurora-drift 26s var(--ease-in-out) infinite alternate;
}
body::after { /* 点阵纹理（细则层，极淡） */
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
  background-size: 26px 26px;
}
@keyframes aurora-drift {
  0% { transform: scale(1) translate(0, 0); }
  100% { transform: scale(1.08) translate(-2%, 2.5%); }
}
@keyframes fade-slide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ── 侧边栏（液态玻璃；唯一常驻 blur 面 ──） */
aside {
  width: 216px; flex: none; z-index: var(--z-base);
  container: sidebar / inline-size; /* W2-A 渐进增强：CQ 容器（不支持者忽略） */
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
  border-right: 1px solid var(--glass-border);
  display: flex; flex-direction: column; padding: var(--space-4) 10px 10px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden;
}
aside .logo {
  margin: 0; /* W7-C（P2-4）：div→h1 后吞掉 UA 缺省外距 */
  font-size: 19px; font-weight: var(--font-bold); padding: 2px 12px var(--space-4);
  letter-spacing: .4px; position: relative;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
aside .logo small {
  display: block; font-size: 10px; font-weight: var(--font-normal);
  -webkit-text-fill-color: var(--muted); color: var(--muted);
  letter-spacing: 1.5px; margin-top: 2px;
}
aside nav .group {
  color: var(--muted2); font-size: 10.5px; text-transform: uppercase;
  letter-spacing: 1.6px; padding: var(--space-3) 12px 4px; font-weight: var(--font-semibold);
}
aside nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: none; color: var(--muted); border: none; padding: 7px 12px;
  cursor: pointer; border-radius: var(--radius-sm); font-size: 13.5px;
  font-weight: var(--font-medium);
  transition: background var(--transition-fast) var(--ease-out),
              color var(--transition-fast) var(--ease-out),
              transform var(--transition-fast) var(--ease-out);
  border-left: 3px solid transparent;
}
aside nav button .ico {
  width: 18px; text-align: center; font-size: 14px;
  transition: transform var(--transition-fast) var(--ease-spring);
}
aside nav button:hover { background: var(--surface-hover); color: var(--fg); }
aside nav button:hover .ico { transform: scale(1.12); }
aside nav button.active {
  background: var(--surface-hover); color: var(--accent);
  border-left-color: var(--accent); font-weight: var(--font-semibold);
}
aside .foot { margin-top: auto; padding: 10px 12px; font-size: 11px; color: var(--muted2); }
/* W7-C（架构批 P2-8）：.pk-hint 此前是死类（命令面板按钮里的 Ctrl+K
   提示 span 无任何样式定义）——补 muted 小字弱化档（muted2×panel2 对比度
   在三主题矩阵钉内 ≥4.5）。 */
.pk-hint { color: var(--muted2); font-size: 10px; margin-left: 4px; }

/* ── 主区 ── */
main {
  flex: 1; padding: var(--space-5) var(--space-8); max-width: 1620px;
  margin: 0 auto; position: relative; z-index: var(--z-base); min-width: 0;
}
.pagehead { display: flex; align-items: baseline; gap: 14px; margin-bottom: var(--space-4); }
h2.page {
  margin: 0; font-size: var(--text-xl); font-weight: var(--font-bold);
  letter-spacing: .2px;
}
h2.page small { color: var(--muted); font-size: 12px; margin-left: 10px; font-weight: var(--font-normal); }
.pagehead .spacer { flex: 1; }

/* ── 面板（半透明表面+微光边框+顶部高光；不挂 blur——面板数量多，
      指南 §7.2 限量红线；玻璃 blur 只给 aside/palette/lightbox）── */
.panel {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius-xl); padding: var(--space-4);
  margin-bottom: var(--space-4); box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition-base) var(--ease-out),
              border-color var(--transition-base) var(--ease-out);
  animation: fade-slide var(--transition-slow) var(--ease-out) backwards;
}
.panel:hover { border-color: var(--glass-border); box-shadow: var(--shadow); }
/* W7-C（架构批 P2-3，guide §10.3）：入场动画 50ms 交错阶梯（此前全部
   同拍）；nth-child 6 档封顶，后续面板不再加迟滞。.panel 动画简写已带
   backwards 填充=延迟窗内保持初帧不可见。轮询页（tune/loopboard）只更新
   面板内子容器、不重建面板元素，阶梯不会随轮询重放。 */
.panel:nth-child(2) { animation-delay: 50ms; }
.panel:nth-child(3) { animation-delay: 100ms; }
.panel:nth-child(4) { animation-delay: 150ms; }
.panel:nth-child(5) { animation-delay: 200ms; }
.panel:nth-child(n+6) { animation-delay: 250ms; }
.panel b.title {
  display: block; margin-bottom: 10px; font-size: 13px; color: var(--accent);
  letter-spacing: .5px; font-weight: var(--font-semibold);
}
.panel .wclose {
  float: right; background: none; border: none; color: var(--muted2);
  cursor: pointer; font-size: 15px; padding: 0 4px; border-radius: var(--radius-xs);
  transition: color var(--transition-fast), background var(--transition-fast);
}
.panel .wclose:hover { color: var(--err); background: var(--err-bg); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-4); }
#widget-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--space-4); }
#widget-grid .widget { grid-column: span 4; }
#widget-grid .widget.w6 { grid-column: span 6; }
#widget-grid .widget.w12 { grid-column: span 12; }
@media (max-width: 1150px) {
  .grid2, .grid3 { grid-template-columns: 1fr; }
  #widget-grid .widget, #widget-grid .widget.w6 { grid-column: span 12; }
}
/* W7-C（架构批 P2-11）：窄屏（<900px）策略——R1 审计"仅 1150px 一档、
   <900px 无策略"收账：main 内距收缩、页头允许换行、面板成横滚容器
   （数据表超宽不再撑破版心；sticky 表头改在面板容器内停靠=窄屏合理降级）、
   KPI 卡最小宽 190→150px 保小屏两列。侧栏折叠走 W2-A 的 CQ 门
   （@supports container-type），本块不触碰。长 run 名截断：三张 run_id
   首列表（runs 历史/校准/dashboard 最近 Run）260px 截断省略，悬停全名
   由渲染侧 title 补全（pages.js 同批）。 */
@media (max-width: 900px) {
  main { padding: var(--space-4) var(--space-3); }
  .pagehead { flex-wrap: wrap; row-gap: 4px; }
  .panel { overflow-x: auto; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  #runs-table td:first-child, #cal-table td:first-child, .wbody table td:first-child {
    max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
}

/* ── KPI 卡片（指南 §12.1：accent 顶线 + hover 浮起）── */
.cards {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: var(--space-4); margin-bottom: var(--space-4);
}
.card {
  position: relative; overflow: hidden;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  transition: transform var(--transition-base) var(--ease-out),
              box-shadow var(--transition-base) var(--ease-out),
              border-color var(--transition-base) var(--ease-out);
}
.card::before { /* 顶部 3px 渐变线（连续性原则：引导视线） */
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  opacity: .55; transition: opacity var(--transition-base);
}
.card:hover {
  transform: translateY(-2px); box-shadow: var(--shadow);
  border-color: var(--glass-border);
}
.card:hover::before { opacity: 1; }
/* W2-A（guide §3.9-3.11 / P2-1）：--border-angle 死注册落地——KPI 卡 hover
   时 conic 渐变描边随 @property 角度旋转（注册于文件头 line 21）。降级三档：
   @property 不支持→角度不插值、静止描边；mask 合成不支持→@supports 门内
   不渲染；prefers-reduced-motion→动画置 none（静止描边，见文件尾降级块）。 */
@supports (mask-composite: exclude) or (-webkit-mask-composite: xor) {
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    padding: 1px; pointer-events: none;
    background: conic-gradient(from var(--border-angle), var(--accent), var(--accent2), var(--accent));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0; transition: opacity var(--transition-base) var(--ease-out);
  }
  .card:hover::after { opacity: 1; animation: border-spin 4s linear infinite; }
}
@keyframes border-spin { to { --border-angle: 360deg; } }
.card .k { color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; }
/* A8-A：KPI 数字防跳动——tabular-nums 等宽数字（刷新/轮询时位宽不抖） */
.card .v { font-size: 23px; font-weight: 650; margin-top: 4px; letter-spacing: .3px; font-variant-numeric: tabular-nums; }
.card .v.ok { color: var(--ok); } .card .v.warn { color: var(--warn); } .card .v.err { color: var(--err); }

/* ── A8-A（R6 审计 P-2/P-3/P-4 打磨批）：骨架屏/空态三件式/错误态动作化 ──
   骨架占位条：shimmer=伪元素高光带 translateX 扫过（仅 transform，§7.2
   合规红线；不新增 backdrop-filter）；prefers-reduced-motion 全局降级之外
   文件尾显式 animation:none → 静态灰块。 */
.skeleton {
  position: relative; overflow: hidden; height: 12px; border-radius: var(--radius-xs);
  background: var(--panel2); margin: 9px 0;
}
.skeleton::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, var(--surface-hover), transparent);
  transform: translateX(-100%);
  animation: skeleton-sweep 1.4s var(--ease-in-out) infinite;
}
@keyframes skeleton-sweep { to { transform: translateX(100%); } }
.skeleton-wrap { padding: 2px 0; }
/* 空态三件式：图标+一句话+下一步动作钮（横排 flex；窄处自动换行） */
.empty-state { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 2px; }
.empty-state .empty-ico, span.empty-ico { font-size: 20px; line-height: 1; }
.empty-state .empty-txt, span.empty-txt { flex: 1; min-width: 200px; color: var(--muted); }
/* 错误态动作化：badge+错误串+重试钮一行式（W7-C detail 内联面板模式推广） */
.err-panel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 2px 0; }
/* A8-A：图表容器高度锚——数据未到时预留空间防加载跳动（与 plotCard 传参同值） */
#splot-echart { min-height: 320px; }
#tune-trials-chart { min-height: 220px; }
#cal-evolution { min-height: 300px; }

/* ── 表格（粘性表头+斑马纹+悬停高亮）── */
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border-2); }
th {
  color: var(--muted); font-weight: var(--font-semibold); font-size: 11.5px;
  text-transform: uppercase; letter-spacing: .6px;
  position: sticky; top: 0; background: var(--bg2); z-index: var(--z-sticky);
}
tbody tr { transition: background var(--transition-fast); }
tbody tr:nth-child(even) { background: var(--panel2); }
tbody tr:hover { background: var(--surface-hover); }
tr.clickable { cursor: pointer; }
/* W5-S17（架构批，R1 §面3 虚拟滚动 watch 激活）：runs 表行数自适应降级
   ——筛选后行数 >200（view_runs.js VROWS_THRESHOLD 单源）时表挂 .vrows，
   视口外行 content-visibility:auto 跳过渲染（零新依赖的轻量虚拟化）；
   不支持者忽略本规则=全量渲染旧行为降级。contain-intrinsic-size 预置行高
   （真机实测 36.42px）防滚动条跳动；"auto" 关键字让浏览器记住实际渲染
   高度覆盖预置值。真机数据定案（Chrome 155，500 行×6 列）：JS+DOM 重建
   8.2ms/滚动 180fps 零掉帧——本机流畅，cv 在 tr 上布局/绘制实测无感收益
   但零风险（渐进增强+引擎差异兜底），守卫主价值=行数增长挂点（>1000 行
   升级 renderVirtualList 仍挂 watch）；数据归档
   内部证据目录。 */
#runs-table.vrows tbody tr {
  content-visibility: auto;
  contain-intrinsic-size: auto 36px;
}
/* UI-R4 a11y：div 可点行（活动流/配方目录/文件浏览器行）指针形——
   键盘焦点环由全局 :focus-visible 提供（PR-1 钉禁删），零新焦点样式。 */
div.clickable { cursor: pointer; }
.badge {
  display: inline-block; padding: 1px 9px; border-radius: var(--radius-xs);
  font-size: 11.5px; font-weight: var(--font-semibold); letter-spacing: .3px;
}
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.err { background: var(--err-bg); color: var(--err); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.muted { background: var(--panel2); color: var(--muted); }

/* ── 表单 ── */
input, select, textarea {
  background: var(--input-bg); color: var(--fg); border: 1px solid var(--border);
  padding: 6px 10px; border-radius: var(--radius-sm); font: inherit;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent); /* 焦点环保持默认 outline（a11y 钉禁删），叠加边框色+辉光 */
  box-shadow: 0 0 0 3px var(--primary-glow);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* W7-C（架构批 P2-5，guide §7.3）：backdrop-filter 缺失引擎降级——
   玻璃面半透明底（alpha .66）没有模糊时背后内容透出发糊，退成不透明实底。
   #lightbox 底是深色遮罩（alpha .78），无模糊仍可读，不进降级块。 */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  aside, #palette { background: var(--panel-solid); }
}

/* ── 命令面板（玻璃模态）── */
#palette-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(2, 6, 16, .55);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  z-index: var(--z-overlay); align-items: flex-start;
  justify-content: center; padding: 12vh 16px 0;
}
#palette-overlay.show { display: flex; }
#palette {
  width: min(640px, 100%); background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); overflow: hidden;
  animation: fade-slide var(--transition-fast) var(--ease-out);
}
#palette-in {
  width: 100%; border: none; background: transparent; color: var(--fg);
  padding: 13px 16px; font: inherit; font-size: 15px;
  border-bottom: 1px solid var(--border); border-radius: 0;
}
#palette-in::placeholder { color: var(--muted2); }
#palette-in:focus { box-shadow: none; }
#palette-list { max-height: 46vh; overflow-y: auto; margin: 0; padding: 6px; list-style: none; }
#palette-list li {
  padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer;
  display: flex; align-items: baseline; gap: 10px;
  transition: background var(--transition-fast);
}
#palette-list li .pk { color: var(--muted2); font-size: 11.5px; margin-left: auto; white-space: nowrap; }
#palette-list li.sel { background: var(--surface-hover); }
#palette-list li.sel .pt { color: var(--accent); }
/* W3-D（架构批）：palette 行图标（sprite <use> 消费面，挂在 palette.js
   iconSvg）——尺寸定恒、行内垂直居中；颜色由 stroke=currentColor 随行文字
   （选中态随 .sel 的 accent 标题，装饰性 aria-hidden 不进读屏）。 */
#palette-list li .pico {
  width: 14px; height: 14px; flex: none; align-self: center;
}
#palette-hint {
  padding: 6px 14px 9px; color: var(--muted2); font-size: 11.5px;
  border-top: 1px solid var(--border-2);
}
#palette-hint code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; }

/* ── 按钮 ── */
button.act {
  background: linear-gradient(90deg, var(--primary), var(--act2));
  color: var(--act-fg); border: none; padding: 7px 18px;
  border-radius: var(--radius-sm); cursor: pointer; font-weight: 650;
  box-shadow: var(--shadow-glow);
  transition: filter var(--transition-fast), transform var(--transition-fast) var(--ease-out),
              box-shadow var(--transition-fast);
}
body.light button.act { color: #ffffff; }
button.act:hover { filter: brightness(1.12); transform: translateY(-1px); }
button.act:active { transform: translateY(0); }
button.act:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
button.minor {
  background: var(--panel2); color: var(--fg); border: 1px solid var(--border);
  padding: 5px 13px; border-radius: var(--radius-sm); cursor: pointer;
  transition: border-color var(--transition-fast), color var(--transition-fast),
              background var(--transition-fast),
              transform var(--transition-fast) var(--ease-out);
}
button.minor:hover { border-color: var(--accent); color: var(--accent); background: var(--surface-hover); }
button.danger {
  background: transparent; color: var(--err); border: 1px solid var(--err);
  padding: 5px 13px; border-radius: var(--radius-sm); cursor: pointer;
  transition: background var(--transition-fast), color var(--transition-fast),
              transform var(--transition-fast) var(--ease-out);
}
button.danger:hover { background: var(--err-bg); }
/* W7-C（微交互一致性）：press 反馈统一——.act/.primary 已有 hover/active
   面，.minor/.danger/.chipbtn 此前只有 hover 无 active；补 1px 下压位移
   （transform 已加进各自 transition 链），触感与主按钮同构。 */
button.minor:active, button.danger:active, .chipbtn:active { transform: translateY(1px); }
/* W2-A（架构批 P0-1）：pages.js 三处 class='primary' 主按钮（工具箱/画廊/
   剖析页"计算/开始采样"）此前无样式规则、按 UA 默认灰裸奔——补主色变体：
   accent→accent2 渐变底 + --act-fg 深字/浅色反白（三主题停靠色 ≥4.5:1，
   见 TestContrastPin primary 钉），状态面与 .act 同构。 */
button.primary {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  color: var(--act-fg); border: none; padding: 7px 18px;
  border-radius: var(--radius-sm); cursor: pointer; font-weight: 650;
  box-shadow: var(--shadow-glow);
  transition: filter var(--transition-fast), transform var(--transition-fast) var(--ease-out),
              box-shadow var(--transition-fast);
}
body.light button.primary { color: #ffffff; }
button.primary:hover { filter: brightness(1.12); transform: translateY(-1px); }
button.primary:active { transform: translateY(0); filter: brightness(.98); }
button.primary:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
button.primary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
pre {
  background: var(--input-bg); padding: 10px; overflow: auto; max-height: 340px;
  border-radius: var(--radius-sm); font-size: 12px; border: 1px solid var(--border-2);
}
canvas.plot { background: var(--plot-bg); width: 100%; height: 260px; border-radius: var(--radius-sm); }
/* W2-C 跳过链接（a11y）：默认视觉隐藏，键盘聚焦时置顶可见。
   W5-S23：color 原引"--text"（未定义变量名，只有 --text-xs 等字号族），
   靠 unset→继承侥幸可读的潜伏破面修正为 --fg 单源。 */
.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: var(--z-overlay);
  background: var(--panel); color: var(--fg); padding: 8px 14px;
  border-radius: var(--radius-md); border: 1px solid var(--accent);
}
.skip-link:focus-visible { left: 12px; top: 12px; outline: 2px solid var(--accent); }
/* W5-S23（深审 b 面）：视觉隐藏工具类（读屏可及、视觉零占位）——
   表格 caption/补充说明的读屏命名通道（kitTable caption 参数消费）。 */
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}
.muted { color: var(--muted); }

/* ── 消息 Toast（#msg；固定右上滑入，4s 自动消退由 msg() 驱动）── */
.msg {
  padding: 10px 16px; border-radius: var(--radius-md); margin-bottom: var(--space-3);
  display: none; position: fixed; top: var(--space-4); right: var(--space-4);
  z-index: calc(var(--z-overlay) + 10); max-width: 420px;
  box-shadow: var(--shadow-lg); font-weight: var(--font-medium);
  animation: toast-in var(--transition-slow) var(--ease-spring);
}
@keyframes toast-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
.msg.ok { background: var(--ok-bg); color: var(--ok); display: block; border: 1px solid var(--ok); backdrop-filter: blur(8px); }
.msg.err { background: var(--err-bg); color: var(--err); display: block; border: 1px solid var(--err); backdrop-filter: blur(8px); }

#model3d { width: 100%; height: 420px; }

/* ── 灯箱（玻璃模糊背景）── */
#lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(2, 6, 16, .78);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: var(--z-modal); align-items: center; justify-content: center;
  flex-direction: column; cursor: zoom-out;
}
#lightbox.show { display: flex; }
#lightbox canvas, #lightbox img {
  max-width: 94vw; max-height: 88vh; background: var(--input-bg);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
}
#lightbox .cap { margin-top: var(--space-2); }

/* ── 对话气泡 ── */
#chat-log { height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.bubble { max-width: 82%; padding: 8px 12px; border-radius: var(--radius-md); white-space: pre-wrap; }
.bubble.user { align-self: flex-end; background: var(--primary); color: #ffffff; }
.bubble.bot { align-self: flex-start; background: var(--panel2); }
.bubble.md p { margin: 4px 0; }
.bubble.md h1, .bubble.md h2, .bubble.md h3 { font-size: 13.5px; margin: 8px 0 4px; color: var(--accent); }
.bubble.md ul, .bubble.md ol { margin: 4px 0; padding-left: 18px; }
.bubble.md code { background: rgba(127, 140, 160, .18); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.bubble.md pre { background: var(--input-bg); padding: 8px; border-radius: var(--radius-xs); max-height: 260px; }
.bubble.md table { border-collapse: collapse; margin: 6px 0; }
.bubble.md th, .bubble.md td { border: 1px solid var(--border); padding: 3px 8px; font-size: 12px; }

.legend span { margin-right: 14px; }
.legend3d { margin-top: 6px; font-size: 12px; }
.legend3d .chip {
  display: inline-block; width: 12px; height: 12px; border-radius: 3px;
  margin: 0 4px -2px 12px; border: 1px solid var(--border);
}
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: var(--space-3); }
.spin {
  display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent);
  border-top-color: transparent; border-radius: var(--radius-full);
  animation: sp 1s linear infinite; vertical-align: -2px;
}
@keyframes sp { to { transform: rotate(360deg); } }
details.help {
  background: var(--panel2); border: 1px dashed var(--border); border-radius: var(--radius-md);
  padding: 8px 12px; margin-bottom: var(--space-4); font-size: 12.5px; color: var(--muted);
}
details.help summary { cursor: pointer; color: var(--accent); }
details.help li { margin: 3px 0; }
.chipbtn {
  border: 1px solid var(--border); background: var(--panel2); color: var(--muted);
  padding: 4px 12px; border-radius: var(--radius-full); cursor: pointer; font-size: 12px;
  transition: color var(--transition-fast), border-color var(--transition-fast),
              background var(--transition-fast),
              transform var(--transition-fast) var(--ease-out);
}
.chipbtn:hover { color: var(--accent); border-color: var(--accent); background: var(--surface-hover); }

/* ── 指南页 ── */
.guide-flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--space-3); margin: 10px 0; }
.guide-step { background: var(--panel2); border-radius: var(--radius-md); padding: var(--space-3); }
.guide-step .n { color: var(--accent); font-weight: var(--font-bold); font-size: 18px; }
.guide-step b { display: block; margin: 4px 0; }
.guide-step div { font-size: 12px; color: var(--muted); }
.glossary td:first-child { font-weight: var(--font-semibold); color: var(--accent); white-space: nowrap; }

/* ── PlotCard 工具条 ── */
.plotcard-tools { display: flex; gap: 6px; align-items: center; margin-bottom: 2px; }
.plotcard-tools .plotcard-spacer { flex: 1; }
.plotcard-tools .plotcard-title { color: var(--accent); font-size: 12.5px; }
.plotcard-tools .plotcard-btn { padding: 1px 9px; font-size: 11px; border-radius: var(--radius-xs); }

/* ── 报告 TOC ── */
.report-toc {
  flex: none; width: 190px; position: sticky; top: var(--space-2); align-self: flex-start;
  max-height: 80vh; overflow: auto; border-right: 1px solid var(--border);
  padding-right: 8px; font-size: 12px;
}
.report-toc a {
  display: block; color: var(--muted); text-decoration: none; padding: 2px 6px;
  border-radius: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color var(--transition-fast), background var(--transition-fast);
}
.report-toc a.toc-h3 { padding-left: 18px; font-size: 11.5px; }
.report-toc a:hover, .report-toc a.active { color: var(--accent); background: var(--panel2); }
.report-toc a.active { font-weight: var(--font-semibold); }
.report-body { flex: 1; min-width: 0; }
.report-body h2, .report-body h3 { scroll-margin-top: 12px; }

/* ── 滚动条（主题化细滚条）── */
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-full); }
::-webkit-scrollbar-thumb:hover { background: var(--muted2); }
::-webkit-scrollbar-track { background: transparent; }

/* ── 打印面（沿用 PR-4 口径）── */
@media print {
  body { background:#fff !important; color:#111 !important; display:block; }
  body::before, body::after, aside, #msg, #lightbox, #palette-overlay, #chat-float,
  .plotcard-tools, .report-toc, .spin, #fs-browser { display: none !important; }
  button, .toolbar .chipbtn { display: none !important; }
  main { padding: 0; max-width: none; }
  .panel, .widget, .card { box-shadow:none !important; background:#fff !important;
    border:1px solid #ccc !important; break-inside:avoid; page-break-inside:avoid; }
  table tr { break-inside: avoid; page-break-inside: avoid; }
  pre { max-height: none; background: #f6f6f6; color: #111; }
  a { color: #111 !important; text-decoration: none; }
  .bubble { max-width: 100%; }
}

/* ── 减少动画（指南 §10.4/§15.4）── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-delay: 0ms !important; /* W7-C：入场交错阶梯同步归零（否则延迟窗内空白闪烁） */
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  body::before { animation: none; }
  .card::after { animation: none; } /* W2-A：conic 旋转边框降级=静止描边 */
  .skeleton::after { animation: none; } /* A8-A：骨架 shimmer 降级=静态灰块 */
}

/* ── 渐进增强（guide §1.1 Container Queries / :has() 落地，W2-A）：
      sidebar 窄宽折叠 + 表格行状态竖线。不支持 CQ/@supports/:has() 的引擎
      对应块整体忽略=零劣化；窄宽断点（@media）用同一 CQ 前提钉住
      （@supports container-type），杜绝"变窄却不折叠"的半增强态。 ── */
@supports (container-type: inline-size) {
  @media (max-width: 900px) {
    aside { width: 56px; padding-left: 6px; padding-right: 6px; }
  }
}
@container sidebar (max-width: 160px) {
  aside .logo { font-size: 15px; padding-left: 2px; padding-right: 2px; text-align: center; }
  aside .logo small { display: none; }
  aside nav .group { font-size: 0; padding: 6px 0 2px; border-top: 1px solid var(--border-2); }
  aside nav button { justify-content: center; gap: 0; padding-left: 0; padding-right: 0; font-size: 0; }
  aside nav button .ico { font-size: 15px; }
  aside .foot { font-size: 0; padding-left: 4px; padding-right: 4px; text-align: center; }
  aside .foot button { font-size: 0; padding-left: 0; padding-right: 0; }
  aside .foot #palette-open::before { content: "⌘"; font-size: 15px; }
  aside .foot #theme-toggle::before { content: "🌗"; font-size: 14px; }
}
@supports selector(:has(*)) {
  /* 行状态竖线（guide §12.3）：按行内徽章功能色左缘指示；无徽章行不受扰 */
  tbody tr:has(.badge.err) { box-shadow: inset 3px 0 0 var(--err); }
  tbody tr:has(.badge.warn) { box-shadow: inset 3px 0 0 var(--warn); }
  tbody tr:has(.badge.ok) { box-shadow: inset 3px 0 0 var(--ok); }
}
</style>
</head>
